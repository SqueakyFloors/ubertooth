name: Doc API version

# The one check whose whole subject is documentation: it reads every tracked
# Markdown, reStructuredText and roff page and refuses a firmware API version
# pinned into a sample, and it asks whether TEST_PLAN.md, COMPATIBILITY.md and
# the CHANGELOG's top section state the version this tree carries.
#
# Its own workflow, rather than a job in build.yml, because of what it reads
# and when that needs reading. build.yml's `changes` job skips the `scripts`
# job for a branch whose every changed file is documentation, so the check
# that reads documentation was the one check a documentation-only branch never
# ran; and build.yml's push trigger ignores `**.md`, `docs/` and `.kiro/`, so
# such a change was not checked on the merge to main either. This workflow has
# no path filter at all, on a pull request or on a push to main, which is the
# same reason libbtbb-pin.yml has none. It takes a second or two and builds
# nothing.
#
# build.yml's `scripts` job still runs the same check on both of its runners.
# That job does not run on a documentation-only branch, so it is not a second
# gate on the change this workflow exists to catch; what the macOS leg adds is
# this one scan of the real tree with the BSD tools, which no Linux job can
# make. tools/check-doc-api-version-selftest.sh stays there too: it is what
# shows the check still refuses a pinned version, and it only matters on a
# branch that changes the check, which is never a documentation-only branch.
#
# The job name below is in the gating set in
# .kiro/steering/branch-and-review.md; keep the two the same.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same cancellation rule as build.yml: only an older run of the same pull
# request is canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-api-version:
    runs-on: ubuntu-24.04
    # A checkout and a few greps over eighty-odd files.
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Check the documentation does not pin the API version
      # Sample output writes the version as API:<version>, so that a bump has
      # one place to change; TEST_PLAN.md and COMPATIBILITY.md carry the real
      # number, so this also asks whether those two, and the CHANGELOG's top
      # section, are at the version the tree carries. It reads files: no
      # build, no network.
      timeout-minutes: 2
      run: tools/check-doc-api-version.sh
