name: Build

on:
  # Branches get CI through their pull request, so a push to a PR branch does
  # not run everything twice. Every push to main still runs.
  push:
    branches: [main]
    # Documentation and agent-rule changes do not need a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'

  # Run automatically every monday
  schedule:
    - cron: 1 12 * * 1

  # Manual full run, including the *-latest canary
  workflow_dispatch:

# A newer commit on the same pull request cancels that PR's older run. Pushes
# to main and the weekly schedule get a unique group (the run id), so they are
# never cancelled or replaced and each main commit keeps its result. The group
# uses the PR number, so same-named branches from forks cannot collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        # Pinned versions are the supported matrix. The *-latest canary is
        # early warning for future OS/toolchain breaks, so it runs only on the
        # weekly schedule (where a failure emails the owner) or a manual run, not
        # on every PR.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: 'greatscottgadgets/libbtbb'
        path: 'libbtbb'

    - name: Install dependencies (macOS)
      run: brew install fftw
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt update
        sudo apt install libfftw3-dev libusb-1.0-0-dev
      if: runner.os == 'Linux'

    - name: (libbtbb) Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/libbtbb/build

    - name: (libbtbb) Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/libbtbb/build
      # libbtbb (upstream) still declares cmake_minimum_required < 3.5, which
      # CMake 4.x rejects outright -> CMAKE_POLICY_VERSION_MINIMUM=3.5.
      # ENABLE_PYTHON=OFF skips libbtbb's pcaptools, whose setup.py fails on
      # modern setuptools (InvalidVersion: ''); ubertooth only needs the C lib.
      run: cmake $GITHUB_WORKSPACE/libbtbb/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_PYTHON=OFF

    - name: (libbtbb) Build
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: (libbtbb) Install
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: sudo cmake --install . --config $BUILD_TYPE

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/host/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/host/build
      # On macOS, Homebrew puts libusb headers under $(brew --prefix)/include
      # (/opt/homebrew on Apple Silicon, /usr/local on Intel), which is not on
      # the compiler's default search path, so `#include <libusb-1.0/libusb.h>`
      # fails even though cmake finds the library via pkg-config.
      run: |
        EXTRA_C_FLAGS=""
        if [ "${{ runner.os }}" = "macOS" ]; then
          EXTRA_C_FLAGS="-I$(brew --prefix)/include"
        fi
        cmake $GITHUB_WORKSPACE/host/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_FLAGS="$EXTRA_C_FLAGS"

    - name: Build
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # Not a unit test: just confirm a built binary executes and prints usage
      # without a device. ubertooth-util -h is device-less and exits 0; most
      # other tools' -h opens the device first and exits non-zero on a runner.
      run: ./ubertooth-tools/src/ubertooth-util -h

    - name: Capture-to-stdout smoke test
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # No device is present: option parsing still emits a complete 24-byte PCAP
      # global header before device open fails. This verifies binary stdout is
      # unpolluted on every Linux/macOS runner.
      run: |
        set +e
        ./ubertooth-tools/src/ubertooth-btle -q - > le.pcap 2> le.err
        ./ubertooth-tools/src/ubertooth-btle -c - > ppi.pcap 2> ppi.err
        ./ubertooth-tools/src/ubertooth-btle -r - > ng.out 2> ng.err
        set -e
        python3 - <<'PY'
        from pathlib import Path
        for name in ('le.pcap', 'ppi.pcap'):
            data = Path(name).read_bytes()
            assert len(data) == 24, (name, len(data))
            assert data[:4] == bytes.fromhex('4d3cb2a1'), (name, data[:4])
        assert Path('ng.out').read_bytes() == b''
        assert b'not supported' in Path('ng.err').read_bytes()
        PY

    - name: Python import check
      shell: bash
      # Confirm the Python packages at least import (not a functional test).
      run: |
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/specan_ui'); import specan"
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/ubtbr'); import ubtbr"

  firmware:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies (macOS)
      run: |
        # Refresh cask definitions first: the gcc-arm-embedded cask pins a
        # SHA-256 that breaks whenever Arm bumps a point release before the
        # runner image's Homebrew catches up (checksum mismatch on download).
        brew update
        brew install --cask gcc-arm-embedded
        brew install dfu-util
        pip install PyYAML
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt install dfu-util gcc-arm-none-eabi
      if: runner.os == 'Linux'

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Pure-C firmware logic compiled and run with the host compiler -- no ARM
      # toolchain or hardware needed. Fails the job on any assertion failure.
      run: make test

    - name: Build
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Build the compile/link targets (elf/bin/sym) per subdirectory. We skip
      # the default target's final `dfu` step because it shells out to the
      # `ubertooth-dfu` host tool and is only needed to package firmware for
      # flashing, not to verify that the firmware compiles and links.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.os }}
        path: |
          ${{github.workspace}}/firmware/*/*.bin
          ${{github.workspace}}/firmware/*/*.elf
        if-no-files-found: error

  # Lint install.sh and smoke-run it into a scratch prefix, so its platform
  # branches cannot regress silently. Firmware is opt-in (--with-firmware /
  # --flash), so it is neither built nor flashed here.
  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (macOS)
      # The host build deps install.sh would install itself (--skip-deps is
      # used below), plus shellcheck.
      run: brew install cmake pkg-config libusb fftw shellcheck
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      # Same list as install.sh's apt step; shellcheck is preinstalled on
      # GitHub's Ubuntu images but is installed here if it is ever dropped.
      run: |
        sudo apt update
        sudo apt install -y cmake build-essential pkg-config libusb-1.0-0-dev \
          libbluetooth-dev libfftw3-dev python3 python3-venv python3-usb1 git
        command -v shellcheck >/dev/null || sudo apt install -y shellcheck
      if: runner.os == 'Linux'

    - name: Syntax check
      shell: bash
      run: bash -n install.sh

    - name: shellcheck
      shell: bash
      run: shellcheck install.sh

    - name: Smoke run
      shell: bash
      # On macOS a writable --prefix is installed without root, so --no-sudo
      # still installs. On Debian/Ubuntu every install step runs as root and
      # --no-sudo only prints them, so the runner's passwordless sudo is used.
      run: |
        NO_SUDO=""
        if [ "${{ runner.os }}" = "macOS" ]; then
          NO_SUDO="--no-sudo"
        fi
        ./install.sh --skip-deps $NO_SUDO --prefix "$RUNNER_TEMP/prefix" --venv "$RUNNER_TEMP/venv"

    - name: Verify install
      shell: bash
      run: |
        test -x "$RUNNER_TEMP/prefix/bin/ubertooth-util"
        "$RUNNER_TEMP/prefix/bin/ubertooth-util" -h

  # Ubuntu 20.04 is the oldest supported Linux. GitHub retired the hosted
  # ubuntu-20.04 runner, so run it in a container on a current runner. The
  # container is root (no sudo) and starts bare, so install git/toolchain.
  host-ubuntu-20_04:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Install build prerequisites
      run: |
        apt-get update
        apt-get install -y git cmake build-essential pkg-config \
                           libfftw3-dev libusb-1.0-0-dev python3

    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: 'greatscottgadgets/libbtbb'
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h

  firmware-ubuntu-20_04:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Install build prerequisites
      run: |
        apt-get update
        apt-get install -y git make dfu-util gcc-arm-none-eabi

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build firmware
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done

  # Fedora as an early-warning canary: it ships newer CMake/Python/GCC sooner
  # than Ubuntu, so breakage shows here first. Soft-fail on push/PR, hard-fail
  # on the weekly schedule (drift email). Run in a container (no hosted Fedora).
  host-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
    - name: Install build prerequisites
      run: |
        dnf -y install git cmake gcc gcc-c++ make pkgconf-pkg-config \
                       fftw-devel libusb1-devel python3

    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: 'greatscottgadgets/libbtbb'
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE
        ldconfig || true

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h
