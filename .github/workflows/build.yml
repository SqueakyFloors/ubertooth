name: Build

on:
  push:
  pull_request:

  # Run automatically every monday
  schedule:
    - cron: 1 12 * * 1

env:
  BUILD_TYPE: Release

jobs:
  host:
    strategy:
      matrix:
        os: ['macos-latest', 'ubuntu-latest']

      # Don't cancel all builds when one fails
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2

    - uses: actions/checkout@v2
      name: Fetch libbtbb
      with:
        repository: 'greatscottgadgets/libbtbb'
        path: 'libbtbb'

    - name: Install dependencies (macOS)
      # Python 3.12+ (3.14 on current runners) no longer bundles setuptools
      # (PEP 632), so specan_ui's setup.py fails with ModuleNotFoundError.
      # Install it explicitly. --break-system-packages is needed because the
      # runner's python is an externally-managed Homebrew install.
      run: |
        brew install fftw
        python3 -m pip install --break-system-packages setuptools
      if: matrix.os == 'macos-latest'

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt update
        sudo apt install libfftw3-dev libusb-1.0-0-dev
      if: matrix.os == 'ubuntu-latest'

    - name: (libbtbb) Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/libbtbb/build

    - name: (libbtbb) Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/libbtbb/build
      # libbtbb (upstream) still declares cmake_minimum_required < 3.5, which
      # CMake 4.x rejects outright -> CMAKE_POLICY_VERSION_MINIMUM=3.5.
      # ENABLE_PYTHON=OFF skips libbtbb's pcaptools, whose setup.py fails on
      # modern setuptools (InvalidVersion: ''); ubertooth only needs the C lib.
      run: cmake $GITHUB_WORKSPACE/libbtbb/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_PYTHON=OFF

    - name: (libbtbb) Build
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: (libbtbb) Install
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: sudo cmake --install . --config $BUILD_TYPE

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/host/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/host/build
      # On Apple-Silicon macOS, Homebrew puts libusb headers under
      # /opt/homebrew/include, which is not on the compiler's default search
      # path, so `#include <libusb-1.0/libusb.h>` fails even though cmake finds
      # the library via pkg-config. Add the Homebrew include dir on macOS.
      run: |
        EXTRA_C_FLAGS=""
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          EXTRA_C_FLAGS="-I$(brew --prefix)/include"
        fi
        cmake $GITHUB_WORKSPACE/host/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_FLAGS="$EXTRA_C_FLAGS"

    - name: Build
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

  firmware:
    strategy:
      matrix:
        os: ['macos-latest', 'ubuntu-latest']

      # Don't cancel all builds when one fails
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true

    - name: Install dependencies (macOS)
      run: |
        # Refresh cask definitions first: the gcc-arm-embedded cask pins a
        # SHA-256 that breaks whenever Arm bumps a point release (e.g.
        # 15.3.rel1 -> rel2) before the runner image's Homebrew catches up,
        # which fails the download with a checksum mismatch. `brew update`
        # pulls the current cask (and matching checksum).
        brew update
        brew install --cask gcc-arm-embedded
        brew install dfu-util
        pip install PyYAML
      if: matrix.os == 'macos-latest'

    - name: Install dependencies (Ubuntu)
      run: |
        sudo apt install dfu-util gcc-arm-none-eabi
      if: matrix.os == 'ubuntu-latest'

    - name: Build
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Build the compile/link targets (elf/bin/sym) per subdirectory. We skip
      # the default target's final `dfu` step because it shells out to the
      # `ubertooth-dfu` host tool (which pulls in libubertooth/libusb/libbtbb)
      # and is only needed to package firmware for flashing, not to verify that
      # the firmware compiles and links. CI's job here is the build check.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done

