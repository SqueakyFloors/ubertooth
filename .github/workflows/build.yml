name: Build

on:
  # Branches get CI through their pull request, so a push to a PR branch does
  # not run everything twice. Every push to main still runs.
  push:
    branches: [main]
    # Documentation and agent-rule changes do not need a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'

  # Full tier: weekly, on a published release, or on demand.
  schedule:
    - cron: 1 12 * * 1
  release:
    types: [published]
  workflow_dispatch:

# A newer commit on the same pull request cancels that PR's older run. Pushes
# to main and the weekly schedule get a unique group (the run id), so they are
# never cancelled or replaced and each main commit keeps its result. The group
# uses the PR number, so same-named branches from forks cannot collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two tiers, to keep pull requests fast and cheap:
# - Minimal (pull requests, pushes to main): host and firmware on one Linux
#   and one macOS runner.
# - Full (weekly schedule, published release, manual run): the whole supported
#   matrix, the *-latest canary, the Ubuntu 20.04 containers and Fedora. The
#   release run is a record after publishing, not a gate: run the full tier
#   manually (this workflow and install-sh.yml) before cutting a release.
# install.sh has its own workflow (install-sh.yml) that runs on PRs only when
# install.sh changes. A tier-dependent matrix must use the github context
# (env is not available in strategy), so the full-tier test is repeated below.
env:
  BUILD_TYPE: Release
  # libbtbb comes from this project's fork, pinned to a commit so a push there
  # cannot change an ubertooth build. This is the place to bump it: every job
  # below fetches that commit, and the libbtbb-pin workflow reads the two
  # lines below as the pin, names the other files that write it out, and fails
  # until they all agree.
  LIBBTBB_REPO: SqueakyFloors/libbtbb
  LIBBTBB_REF: 2fd0d391d99e9b0620146f63f439c1ec74f79861
  # The ARM toolchain, named once so the step that fetches it, the step that
  # resolves it for the cache key, and the Ubuntu 20.04 container below cannot
  # drift apart. gcc-arm-none-eabi recommends a large set of packages none of
  # this needs, so recommends are skipped and the two runtimes are named
  # explicitly: newlib for every image, and the C++ one for firmware/
  # bootloader, which is the only thing in the tree that links libstdc++.
  # macOS needs no equivalent; the toolchain cask carries both.
  ARM_PACKAGES: >-
    dfu-util gcc-arm-none-eabi libnewlib-arm-none-eabi
    libstdc++-arm-none-eabi-newlib

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        # Full tier: the pinned supported matrix plus the ubuntu-latest canary
        # (early warning for OS/toolchain breaks). Minimal tier: one Linux and
        # one macOS runner.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    # Above the bounded install step below plus the build and the tests, so a
    # step that overruns fails itself and names what stalled rather than being
    # cancelled along with the job. The libbtbb pin check used to run here and
    # wanted 4 of these minutes; it is its own job now.
    timeout-minutes: 16

    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    # Every install step is given a timeout-minutes of its own, so a package
    # source that stops sending bytes fails a step that names it instead of
    # hanging until the job timeout cancels the job, where it reads as a
    # broken build. On apt that limit is tightened and retried per attempt by
    # tools/retry.sh; brew is left alone, because on an older runner it
    # legitimately builds a dependency from source for minutes at a time and
    # no short limit can tell that apart from a stall.
    #
    # On apt only the downloads are wrapped, never the installation that
    # follows: a command killed while unpacking would leave dpkg half-done,
    # which no retry can repair. Acquire::http::Timeout asks apt to give up on
    # a connection that has gone quiet, so a dead mirror becomes apt's own
    # error instead of a wait with no end; the limit below is the outer bound,
    # sized for a mirror that is merely slow.
    #
    # Each step limit has to cover the retries AND the install that follows
    # them, which is deliberately not bounded, or GitHub cancels the step
    # before tools/retry.sh can say what happened.
    - name: Install dependencies (macOS)
      # One bottle, where the firmware job runs several brew commands, so this
      # needs far less room than the 12 minutes that step is given.
      timeout-minutes: 8
      run: brew install fftw
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      # libbluetooth-dev is what ubertooth-scan and ubertooth-follow need:
      # without it cmake skips both tools, so nothing on Linux CI compiled
      # them or ran their CLI tests. macOS has no BlueZ, so there they stay
      # skipped by design.
      # One bounded call of 180 seconds an attempt, so at most 6 minutes 30
      # seconds, and then the install. Ten minutes leaves the install over
      # three of them: the step limit has to sit above tools/retry.sh's worst
      # case plus the unpacking, or the corner where attempt one times out and
      # attempt two succeeds is cancelled part way through dpkg -- the opaque
      # failure this whole arrangement exists to remove.
      timeout-minutes: 10
      # sudo is outside the helper so the limit lands on apt itself: killing
      # sudo would leave apt holding the dpkg lock.
      run: |
        packages="libfftw3-dev libusb-1.0-0-dev libbluetooth-dev"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        # Refreshing the index and fetching the packages is one unit to retry:
        # an attempt that skipped the refresh would keep failing on whatever
        # made the last one fail.
        sudo tools/retry.sh 180 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d $packages"
        sudo apt-get install -y $packages
      if: runner.os == 'Linux'

    - name: (libbtbb) Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/libbtbb/build

    - name: (libbtbb) Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/libbtbb/build
      # ENABLE_PYTHON=OFF skips libbtbb's pcaptools: ubertooth links only the C
      # library, and building the Python tools adds a pip wheel build and a
      # pip install into the CI prefix that nothing here uses.
      run: cmake $GITHUB_WORKSPACE/libbtbb/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF

    - name: (libbtbb) Build
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: (libbtbb) Install
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: sudo cmake --install . --config $BUILD_TYPE

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/host/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/host/build
      # On macOS, Homebrew puts libusb headers under $(brew --prefix)/include
      # (/opt/homebrew on Apple Silicon, /usr/local on Intel), which is not on
      # the compiler's default search path, so `#include <libusb-1.0/libusb.h>`
      # fails even though cmake finds the library via pkg-config.
      run: |
        EXTRA_C_FLAGS=""
        if [ "${{ runner.os }}" = "macOS" ]; then
          EXTRA_C_FLAGS="-I$(brew --prefix)/include"
        fi
        cmake $GITHUB_WORKSPACE/host/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_FLAGS="$EXTRA_C_FLAGS"

    - name: Build
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # Not a unit test: just confirm a built binary executes and prints usage
      # without a device. ubertooth-util -h is device-less and exits 0; most
      # other tools' -h opens the device first and exits non-zero on a runner.
      run: ./ubertooth-tools/src/ubertooth-util -h

    - name: Capture-to-stdout smoke test
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # No device is present: option parsing still emits a complete 24-byte PCAP
      # global header before device open fails. This verifies binary stdout is
      # unpolluted on every Linux/macOS runner. The capture needs a mode to run
      # in, since a command line with no work in it is refused before any
      # capture file is opened; -r - is refused while the options are read, so
      # it needs none.
      run: |
        set +e
        ./ubertooth-tools/src/ubertooth-btle -n -q - > le.pcap 2> le.err
        ./ubertooth-tools/src/ubertooth-btle -n -c - > ppi.pcap 2> ppi.err
        ./ubertooth-tools/src/ubertooth-btle -r - > ng.out 2> ng.err
        set -e
        python3 - <<'PY'
        from pathlib import Path
        for name in ('le.pcap', 'ppi.pcap'):
            data = Path(name).read_bytes()
            assert len(data) == 24, (name, len(data))
            assert data[:4] == bytes.fromhex('4d3cb2a1'), (name, data[:4])
        assert Path('ng.out').read_bytes() == b''
        assert b'not supported' in Path('ng.err').read_bytes()
        PY

    - name: Python import check
      shell: bash
      # Confirm the Python packages at least import (not a functional test).
      run: |
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/specan_ui'); import specan"
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/ubtbr'); import ubtbr"

  firmware:
    strategy:
      fail-fast: false
      matrix:
        # Same tiers as the host job.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    # Above the install step below plus the build, as in the host job. The
    # cold-run install step may take fourteen of these minutes on its own.
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    # The ARM toolchain is the big download in this workflow: 574 MB of
    # packages on Ubuntu 24.04, a cask of comparable size on macOS. A mirror
    # that stops sending bytes part way through used to leave this step
    # waiting until the job timeout, so each step is bounded as in the host
    # job.
    - name: Install dependencies (macOS)
      # Twelve minutes is well above what this step has ever legitimately
      # taken (four and a half on the oldest runner, where brew rebuilt a
      # dependency from source), and well below the job's twenty, so a brew
      # that never finishes fails here by name.
      timeout-minutes: 12
      run: |
        # Refresh cask definitions first: the gcc-arm-embedded cask pins a
        # SHA-256 that breaks whenever Arm bumps a point release before the
        # runner image's Homebrew catches up (checksum mismatch on download).
        brew update
        brew install --cask gcc-arm-embedded
        brew install dfu-util
        pip install PyYAML
      if: runner.os == 'macOS'

    # Bounding the download reports a slow mirror instead of waiting for it,
    # but it cannot make the download finish, and the download is large.
    # Measured on ubuntu-24.04 (noble, gcc-arm-none-eabi 13.2.rel1-2): 574 MB
    # for the four packages, 463 MB of it the C++ runtime
    # (libstdc++-arm-none-eabi-newlib), 57 MB the compiler itself and 49 MB
    # newlib. Only the compiler was counted when this job was first bounded,
    # which is why older notes about it say 94 MB; naming the two runtimes
    # explicitly, rather than taking them as recommends, is what made the real
    # figure visible.
    #
    # The same fetch took 31 seconds on a healthy mirror and, an hour later on
    # a bad one, moved 3 MB in 63 seconds and did not get through the compiler
    # in either attempt. Keeping the .deb files between runs is the only thing
    # that removes the download, so the two steps below do that and the fetch
    # beneath them is unchanged for the run that has to do it for real.
    #
    # The key is the set of files apt would fetch, not the package names.
    # apt-get --print-uris resolves the names against the runner image's
    # package index without downloading anything, so the key changes exactly
    # when the files behind those names change: a point release of the
    # compiler gets a new key, a cold download and a new cache, and CI goes
    # on building with the toolchain the distribution ships today. That is
    # what a pinned tarball from the vendor would have cost.
    #
    # No restore-keys: a near miss would hand apt an archive directory full
    # of .deb files it no longer wants, which it does not clean up, so the
    # saved cache would grow with every toolchain bump. A miss here is a
    # cold run, which is what the bound and the retry below are for.
    - name: Resolve the toolchain packages
      id: toolchain
      if: runner.os == 'Linux'
      # bash, not the default shell: GitHub's `bash` keyword adds -o pipefail,
      # so a failing apt-get in the pipeline below fails this step. Without it
      # the pipeline's status is sort's, the step would succeed with an empty
      # list, and the key would become the hash of nothing -- one constant that
      # matches every toolchain. Nothing downstream would complain, because the
      # install refetches whatever is missing, so the key would quietly stop
      # being a key.
      shell: bash
      run: |
        uris="$RUNNER_TEMP/toolchain-uris"
        # What is left of each line is the file name, its size and its hash;
        # the mirror URL in front of them is dropped, so a run sent to a
        # different mirror still matches the cache.
        sudo apt-get install --print-uris -y --no-install-recommends -d \
          $ARM_PACKAGES | sed -n "s/^'[^']*' //p" | sort > "$uris"
        cat "$uris"
        # The belt to pipefail's braces: a key may only be computed from a
        # list that has something in it. An empty list is a resolve that went
        # wrong, never a toolchain with no files.
        if [ ! -s "$uris" ]; then
          echo "error: apt resolved no files for the toolchain packages, so" >&2
          echo "       there is nothing to key the cache on" >&2
          exit 1
        fi
        echo "key=$(sha256sum < "$uris" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore the toolchain packages
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      # Its own limit, because restoring half a gigabyte from the cache
      # service is the one network fetch here that tools/retry.sh does not
      # wrap: a restore that stalls should fail a step that names it.
      timeout-minutes: 8
      with:
        path: ${{ runner.temp }}/apt-archives
        # No runner label in the key. Two images that resolve the same .deb
        # files want the same cache, and ubuntu-latest is ubuntu-24.04 today,
        # so keying on the label would have stored half a gigabyte twice and
        # left the canary with a cold run of its own in every steady-state
        # run. On the first run after a toolchain bump both miss together and
        # only one of them saves, so the canary pays a cold run that once;
        # the alternative is paying for a second copy forever.
        key: arm-toolchain-${{ steps.toolchain.outputs.key }}

    - name: Install dependencies (Ubuntu)
      # This step runs on every Linux run; it is the download inside it that
      # only the run finding nothing cached pays for. That download is what
      # the limit below is sized for, and one attempt has to fetch the whole
      # 574 MB, because a killed apt keeps only the
      # packages it had finished: in a run measured here, attempt two still
      # needed 571 MB of the 574. Five minutes an attempt therefore wants
      # about 2 MB a second, which a healthy mirror beats several times over
      # and a bad one does not come close to. A mirror that slow is reported
      # by name rather than waited on, which is the point of the bound; what
      # removes the wait altogether is the cache above.
      #
      # Fourteen minutes: tools/retry.sh's worst case here is 10 minutes 30,
      # and the rest is for unpacking half a gigabyte of toolchain, which must
      # not be cancelled half done.
      timeout-minutes: 14
      run: |
        archives="$RUNNER_TEMP/apt-archives"
        # apt needs the partial directory to exist before it will fetch.
        mkdir -p "$archives/partial"
        # APT::Sandbox::User=root stops apt dropping to the _apt user for the
        # download, which cannot read a directory under the runner's temp;
        # without it apt warns and silently fetches as root anyway.
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
          -o Dir::Cache::archives=$archives -o APT::Sandbox::User=root"
        sudo tools/retry.sh 300 apt-get $apt_opts \
          install -y --no-install-recommends -d $ARM_PACKAGES
        sudo apt-get $apt_opts install -y --no-install-recommends $ARM_PACKAGES
        # apt wrote these as root; the cache is saved as the runner user.
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        du -sh "$archives"
      if: runner.os == 'Linux'

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Pure-C firmware logic compiled and run with the host compiler -- no ARM
      # toolchain or hardware needed. Fails the job on any assertion failure.
      run: make test

    - name: Build
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Build the compile/link targets (elf/bin/sym) per subdirectory. We skip
      # the default target's final `dfu` step because it shells out to the
      # `ubertooth-dfu` host tool and is only needed to package firmware for
      # flashing, not to verify that the firmware compiles and links.
      #
      # The bootloader is built through its own target in firmware/Makefile,
      # because it is the one image needing the ARM C++ runtime. Its link is
      # also the check that the image still fits: the linker script gives it a
      # 16 KiB region, and a build that outgrows it fails here rather than on a
      # board that will not boot, which matters because it is the one image
      # `ubertooth-dfu` cannot replace.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done
        echo "::group::firmware: bootloader"
        make bootloader
        echo "::endgroup::"

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.os }}
        path: |
          ${{github.workspace}}/firmware/*/*.bin
          ${{github.workspace}}/firmware/*/*.elf
        if-no-files-found: error

  # The scripts in tools/ are CI's own moving parts, and nothing used to lint
  # or test them: a mistake in one surfaced as a confusing failure in whatever
  # job happened to run it. Runs on both tiers, and on both platforms because
  # retry.sh takes an unbounded fallback wherever there is no timeout command,
  # which is every macOS runner and the one path nothing had ever run.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: shellcheck
      # shellcheck is on GitHub's Ubuntu images already. Installing it on
      # macOS as well would cost a brew install to check the same files
      # twice, so the lint is the Linux leg's and the macOS leg is here for
      # the self-test below.
      #
      # ci-scripts/ is left out on purpose: those four scripts belong to
      # upstream's retired Jenkins build, nothing in this fork runs them, and
      # linting them would mean fixing scripts nobody can test.
      if: runner.os == 'Linux'
      timeout-minutes: 6
      run: |
        # The runner image ships shellcheck, so this normally installs
        # nothing. If an image ever drops it, install it rather than have
        # every pull request blocked by a command that is not there; bounded
        # and retried like the other package installs in this workflow.
        if ! command -v shellcheck > /dev/null; then
          apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
          sudo tools/retry.sh 120 sh -c \
            "apt-get $apt_opts update && apt-get $apt_opts install -y -d shellcheck"
          sudo apt-get install -y shellcheck
        fi
        shellcheck tools/*.sh install.sh

    - name: Check that retry.sh bounds, retries and reports
      # Not inline here, unlike the issue-reference check below, because the
      # self-test is long enough to want linting itself and to be worth
      # running by hand: it is one of the tools/*.sh the step above covers.
      run: tools/retry-selftest.sh

  # Issue and pull request numbers must not appear in source, tests or build
  # files (.kiro/steering/branch-and-review.md). A reviewer who happens to know
  # the rule is the only thing that caught the last ones, and only after they
  # had merged. Runs on both tiers: it takes seconds and needs nothing built.
  issue-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Check for issue numbers in source, tests and build files
      run: tools/check-issue-references.sh

    - name: Check that the check still catches one
      # So the step above cannot pass because the scan stopped reaching the
      # files. One plant per kind of file the rule names: a source file, a
      # CMake build file and a Makefile, since the per-directory build files
      # are reached by a different pathspec from the sources and were missed
      # once already. The plants are thrown away with the runner.
      #
      # The number is held in a variable because this workflow is itself a
      # build file the scan reads, and a literal would be a reference of
      # exactly the kind it refuses.
      run: |
        planted=4242
        for file in host/libubertooth/src/ubertooth.c \
                    host/CMakeLists.txt \
                    firmware/bluetooth_rxtx/Makefile; do
          printf '# see #%s\n' "$planted" >> "$file"
          if tools/check-issue-references.sh > planted.out 2>&1; then
            echo "the check passed with a reference planted in $file" >&2
            exit 1
          fi
          grep -q "$file:.*#$planted" planted.out || {
            echo "the check failed, but not on the line planted in $file:" >&2
            cat planted.out >&2
            exit 1
          }
          git checkout -- "$file"
          echo "caught in $file"
        done
        rm -f planted.out
        echo "The check catches a planted reference in source and build files."

  # Ubuntu 20.04 is the oldest supported Linux. GitHub retired the hosted
  # ubuntu-20.04 runner, so run it in a container on a current runner. The
  # container is root (no sudo) and starts bare, so install git/toolchain.
  host-ubuntu-20_04:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Above the bounded install step below plus the libbtbb and host builds.
    timeout-minutes: 18
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    # Checked out first, so the install below can be bounded and retried by
    # tools/retry.sh rather than only bounded. The container has no git yet,
    # so actions/checkout fetches a tarball through the API instead of
    # cloning; nothing in this job reads the history.
    - uses: actions/checkout@v4

    - name: Install build prerequisites
      # This list is far larger than the firmware job's -- build-essential
      # alone pulls in the compiler and the C library headers -- so an
      # attempt gets 240 seconds rather than that job's 120. That is 8
      # minutes 30 of retries at worst, and then the install, which is why
      # the step gets twelve minutes and not ten: unpacking a compiler must
      # not be cancelled part way.
      timeout-minutes: 12
      run: |
        packages="git cmake build-essential pkg-config libfftw3-dev \
          libusb-1.0-0-dev libbluetooth-dev python3"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        # Refreshing the index and fetching the packages is one unit to
        # retry: an attempt that skipped the refresh would keep failing on
        # whatever made the last one fail. The install that follows is not
        # bounded, because a command killed while unpacking leaves dpkg
        # half-done and no retry can repair that.
        tools/retry.sh 240 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d $packages"
        apt-get install -y $packages

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h

  firmware-ubuntu-20_04:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Above the two install steps below plus the checkout and the build. Those
    # two steps may want twenty of these minutes between them on the day the
    # mirror is bad, and this job never has a cache to fall back on.
    timeout-minutes: 24
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    # Installed in two steps so the toolchain download gets the same
    # stalled-mirror guard as the hosted firmware job: tools/retry.sh comes
    # from the checkout, and the checkout needs git first. Both steps skip
    # recommends as the firmware job does; ca-certificates is then needed
    # explicitly for the HTTPS checkout of the submodules.
    - name: Install checkout prerequisites
      # Two bounded commands of 100 seconds, so 3 minutes 40 at worst, and
      # then the install of git and the certificates.
      timeout-minutes: 6
      # Not retried: tools/retry.sh needs the checkout this step installs for.
      # tools/retry.sh really is unavailable here, but timeout is not, so the
      # two downloads are bounded and say what happened, without being retried.
      run: |
        # 124 is the limit being reached, 137 the status of a command that
        # had to be killed at it. Any other failure is apt's own and has
        # printed its reason, so only the limit needs explaining.
        bounded() {
          timeout --kill-after=10s 100 "$@" && return 0
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "error: '$*' never finished; the package mirror has stalled" >&2
          fi
          exit 1
        }
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        bounded apt-get $apt_opts update
        bounded apt-get $apt_opts install -y --no-install-recommends -d \
          ca-certificates git
        apt-get install -y --no-install-recommends ca-certificates git

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install the ARM toolchain
      # The same toolchain as the hosted firmware job, so the same 300 seconds
      # an attempt and the same 14 minutes for the step. Not cached as that
      # job's is: this one runs on the weekly schedule, and a cache goes
      # unused for the same seven days after which GitHub evicts it, so the
      # hit would be a coin toss. This job therefore always pays the cold
      # download, which is the other reason the step limit is generous.
      timeout-minutes: 14
      run: |
        packages="make $ARM_PACKAGES"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        tools/retry.sh 300 apt-get $apt_opts \
          install -y --no-install-recommends -d $packages
        apt-get install -y --no-install-recommends $packages

    - name: Build firmware
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # The bootloader goes through its own target, for the reasons in the
      # firmware job above.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done
        echo "::group::firmware: bootloader"
        make bootloader
        echo "::endgroup::"

  # Fedora as an early-warning canary: it ships newer CMake/Python/GCC sooner
  # than Ubuntu, so breakage shows here first. Hard-fails on the weekly
  # schedule (drift email), soft-fails on release and manual runs. Run in a
  # container (no hosted Fedora).
  host-fedora:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # As in the Ubuntu 20.04 container above.
    timeout-minutes: 18
    container: fedora:latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
    # Checked out first, for the reason given in the Ubuntu 20.04 job above.
    - uses: actions/checkout@v4

    - name: Install build prerequisites
      # The same 240 seconds an attempt and the same twelve minutes for the
      # step as the Ubuntu 20.04 container, for the same reasons: a long
      # package list, and an rpm transaction that must not be cancelled part
      # way through.
      timeout-minutes: 12
      run: |
        packages="git cmake gcc gcc-c++ make pkgconf-pkg-config \
          fftw-devel libusb1-devel bluez-libs-devel python3"
        # dnf has no separate download command here, so the fetch is split
        # off with --downloadonly and keepcache makes the install that
        # follows local. Only the fetch is bounded: killing a download costs
        # nothing, killing an rpm transaction leaves the database to repair.
        tools/retry.sh 240 dnf -y --setopt=keepcache=1 install \
          --downloadonly $packages
        dnf -y --setopt=keepcache=1 install $packages

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE
        ldconfig || true

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h
