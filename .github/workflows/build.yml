name: Build

on:
  # Branches get CI through their pull request, so a push to a PR branch does
  # not run everything twice. Every push to main still runs.
  push:
    branches: [main]
    # Documentation and agent-rule changes do not need a build. The filter
    # stays here, unlike on a pull request below, because nothing is gated on
    # a push: the commit was already built as a pull request head.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
  # No path filter on a pull request, on purpose. A filtered-out workflow
  # reports nothing at all, and the names below are required checks on main,
  # so a documentation-only pull request would wait forever for a check that
  # was never going to run. It runs instead, and the `changes` job decides
  # which jobs do any work: a documentation-only branch gets the cheap Linux
  # checks and a stand-in for each build job.
  pull_request:

  # Full tier: weekly, on a published release, or on demand.
  schedule:
    - cron: 1 12 * * 1
  release:
    types: [published]
  workflow_dispatch:

# A newer commit cancels the older run it supersedes: on a pull request, that
# PR's older run; on main, the run of the previous main commit, so when several
# merges land close together only the newest main commit is built (each PR head
# was already built before it merged). The weekly schedule, releases and manual
# runs get a unique group (the run id) and are never cancelled. The group uses
# the PR number, so same-named branches from forks cannot collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  # Only a pull request's superseded runs are cancelled. Every push to main
  # runs to the end, so each commit main takes is built and tested as merged,
  # even when several merges land close together.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two tiers, to keep pull requests fast and cheap:
# - Minimal (pull requests, pushes to main): host on Ubuntu 22.04, the oldest
#   glibc a hosted runner offers, and 24.04 and on macOS; firmware on one
#   Linux and one macOS runner.
# - Full (weekly schedule, published release, manual run): the whole supported
#   matrix, the *-latest canary, the Ubuntu 20.04 containers and Fedora. The
#   release run is a record after publishing, not a gate: run the full tier
#   manually (this workflow and install-sh.yml) before cutting a release.
# install.sh has its own workflow (install-sh.yml) that runs on PRs only when
# install.sh changes. A tier-dependent matrix must use the github context
# (env is not available in strategy), so the full-tier test is repeated below.
env:
  BUILD_TYPE: Release
  # libbtbb comes from this project's fork, pinned to a commit so a push there
  # cannot change an ubertooth build. This is the place to bump it: every job
  # below fetches that commit, and the libbtbb-pin workflow reads the two
  # lines below as the pin, names the other files that write it out, and fails
  # until they all agree.
  LIBBTBB_REPO: SqueakyFloors/libbtbb
  LIBBTBB_REF: 017676965a77cd7b00bfede343b7800dee6aa6a5
  # The ARM toolchain, named once so the step that fetches it, the step that
  # resolves it for the cache key, and the Ubuntu 20.04 container below cannot
  # drift apart. gcc-arm-none-eabi recommends a large set of packages none of
  # this needs, so recommends are skipped and the two runtimes are named
  # explicitly: newlib for every image, and the C++ one for firmware/
  # bootloader, which is the only thing in the tree that links libstdc++.
  # macOS needs no equivalent; the toolchain cask carries both.
  ARM_PACKAGES: >-
    dfu-util gcc-arm-none-eabi libnewlib-arm-none-eabi
    libstdc++-arm-none-eabi-newlib

jobs:
  # What a pull request touches, so the host, firmware and scripts jobs run
  # only when their side changed. Every other event (main, schedule, release,
  # manual) runs all three. Conservative on purpose: the host jobs are skipped
  # only when every changed file is under firmware/, and the firmware jobs
  # only when no file under firmware/, no workflow and not the shared USB
  # interface header changed. A skipped job counts as passed for a merge.
  #
  # All three are skipped for a documentation-only branch, where there is
  # nothing to build and no script to lint. Each skipped name is still
  # reported, by the stand-in jobs further down; see the comment there.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host: ${{ steps.diff.outputs.host }}
      firmware: ${{ steps.diff.outputs.firmware }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          decide() {
            echo "host=$1" >> "$GITHUB_OUTPUT"
            echo "firmware=$2" >> "$GITHUB_OUTPUT"
            echo "scripts=$3" >> "$GITHUB_OUTPUT"
            echo "host jobs: $1, firmware jobs: $2, scripts job: $3"
          }
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request: running everything"
            decide true true true; exit 0
          fi
          files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "$files"
          # An empty diff means the comparison did not find the branch's
          # changes rather than that there are none, so build everything
          # rather than wave it through.
          if [ -z "$files" ]; then
            echo "no changed files found: running everything"
            decide true true true; exit 0
          fi
          # Documentation only: every changed file is a Markdown file, under
          # docs/ or .kiro/, or a generated man page. Workflows and tools/
          # are deliberately not on this list -- a change there is a change
          # to the checks themselves and runs the lot.
          if ! echo "$files" | grep -qvE '\.md$|^docs/|^\.kiro/|^host/doc/man/'; then
            echo "documentation only: nothing to build or lint"
            decide false false false; exit 0
          fi
          host=false; firmware=false
          if echo "$files" | grep -qv '^firmware/'; then host=true; fi
          if echo "$files" | grep -qE '^firmware/|^\.github/|^host/libubertooth/src/ubertooth_interface\.h$'; then firmware=true; fi
          decide "$host" "$firmware" true

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Full tier: the pinned supported matrix plus the ubuntu-latest canary
        # (early warning for OS/toolchain breaks). Minimal tier: Ubuntu 22.04,
        # the oldest glibc a hosted runner offers, and 24.04, and one macOS
        # runner.
        #
        # A runner added to or renamed in the minimal tier renames a required
        # check on main, so it has to be carried to three other places: the
        # host-skipped stand-in below, the protection rule on main, and the
        # table in CONTRIBUTING.md.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-22.04","ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    # Above the bounded install step below plus the build and the tests, so a
    # step that overruns fails itself and names what stalled rather than being
    # cancelled along with the job. The libbtbb pin check used to run here and
    # wanted 4 of these minutes; it is its own job now. It was 16 before the
    # strict-standard step at the end, which compiles the tree twice more.
    timeout-minutes: 22

    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    # Every install step is given a timeout-minutes of its own, so a package
    # source that stops sending bytes fails a step that names it instead of
    # hanging until the job timeout cancels the job, where it reads as a
    # broken build. On apt that limit is tightened and retried per attempt by
    # tools/retry.sh; brew is left alone, because on an older runner it
    # legitimately builds a dependency from source for minutes at a time and
    # no short limit can tell that apart from a stall.
    #
    # On apt only the downloads are wrapped, never the installation that
    # follows: a command killed while unpacking would leave dpkg half-done,
    # which no retry can repair. Acquire::http::Timeout asks apt to give up on
    # a connection that has gone quiet, so a dead mirror becomes apt's own
    # error instead of a wait with no end; the limit below is the outer bound,
    # sized for a mirror that is merely slow.
    #
    # Each step limit has to cover the retries AND the install that follows
    # them, which is deliberately not bounded, or GitHub cancels the step
    # before tools/retry.sh can say what happened.
    - name: Install dependencies (macOS)
      # One bottle, where the firmware job runs several brew commands, so this
      # needs far less room than the 12 minutes that step is given.
      timeout-minutes: 8
      run: brew install fftw
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      # libbluetooth-dev is what ubertooth-scan and ubertooth-follow need:
      # without it cmake skips both tools, so nothing on Linux CI compiled
      # them or ran their CLI tests. macOS has no BlueZ, so there they stay
      # skipped by design.
      # One bounded call of 180 seconds an attempt, so at most 6 minutes 30
      # seconds, and then the install. Ten minutes leaves the install over
      # three of them: the step limit has to sit above tools/retry.sh's worst
      # case plus the unpacking, or the corner where attempt one times out and
      # attempt two succeeds is cancelled part way through dpkg -- the opaque
      # failure this whole arrangement exists to remove.
      timeout-minutes: 10
      # sudo is outside the helper so the limit lands on apt itself: killing
      # sudo would leave apt holding the dpkg lock.
      run: |
        packages="libfftw3-dev libusb-1.0-0-dev libbluetooth-dev"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        # Refreshing the index and fetching the packages is one unit to retry:
        # an attempt that skipped the refresh would keep failing on whatever
        # made the last one fail.
        sudo tools/retry.sh 180 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d $packages"
        sudo apt-get install -y $packages
      if: runner.os == 'Linux'

    - name: (libbtbb) Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/libbtbb/build

    - name: (libbtbb) Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/libbtbb/build
      # ENABLE_PYTHON=OFF skips libbtbb's pcaptools: ubertooth links only the C
      # library, and building the Python tools adds a pip wheel build and a
      # pip install into the CI prefix that nothing here uses.
      run: cmake $GITHUB_WORKSPACE/libbtbb/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF

    - name: (libbtbb) Build
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: (libbtbb) Install
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: sudo cmake --install . --config $BUILD_TYPE

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/host/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/host/build
      # No include flags of our own, on any runner. This is the plain configure
      # the build guide gives, and on macOS it is also what notices a target
      # left without libusb's include directory: Homebrew keeps libusb's header
      # off the compiler's default search path, so such a target fails to
      # compile on the macOS runners and nowhere else. (The C-standards sweep
      # below passes no include flags either, so it notices too.) An
      # -I$(brew --prefix)/include for the whole build used to hide that, which
      # is how a test target that could not compile reached main.
      #
      # UBERTOOTH_RELEASE=ON in every CI configure that builds the tools for
      # use or test: a checkout here is not on a tag, so the tree would
      # otherwise be read as a development build, where firmware of another
      # API version is only a warning. CI refuses it, as a release does, so
      # nothing passes here on firmware the host was not built for. The
      # compile-only configures (the C-standards sweep below, and the man-page
      # workflow) are left alone: nothing they build is run against a board.
      run: cmake $GITHUB_WORKSPACE/host/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DUBERTOOTH_RELEASE=ON

    - name: Build
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # Not a unit test: just confirm a built binary executes and prints usage
      # without a device. ubertooth-util -h is device-less and exits 0; most
      # other tools' -h opens the device first and exits non-zero on a runner.
      run: ./ubertooth-tools/src/ubertooth-util -h

    - name: Capture-to-stdout smoke test
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # No device is present, so a capture bound for standard output writes
      # nothing at all: the capture is opened only once the board is open and
      # its firmware accepted, so a run that finds no board leaves not even a
      # PCAP header behind. What this checks on every Linux/macOS runner is
      # that standard output stays byte-for-byte empty on that path, which is
      # where a stray printf would show up; how the header itself is written
      # needs a board, and the hardware runs cover it.
      #
      # The capture needs a mode to run in, since a command line with no work
      # in it is refused before any device is opened; -r - is refused while
      # the options are read, so it needs none.
      run: |
        set +e
        ./ubertooth-tools/src/ubertooth-btle -n -q - > le.pcap 2> le.err
        ./ubertooth-tools/src/ubertooth-btle -n -c - > ppi.pcap 2> ppi.err
        ./ubertooth-tools/src/ubertooth-btle -r - > ng.out 2> ng.err
        set -e
        python3 - <<'PY'
        from pathlib import Path
        for name in ('le.pcap', 'ppi.pcap'):
            data = Path(name).read_bytes()
            assert data == b'', (name, data)
        for name in ('le.err', 'ppi.err'):
            assert b'Ubertooth' in Path(name).read_bytes(), (name,)
        assert Path('ng.out').read_bytes() == b''
        assert b'not supported' in Path('ng.err').read_bytes()
        PY

    - name: Python import check
      shell: bash
      # Confirm the Python packages at least import (not a functional test).
      run: |
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/specan_ui'); import specan"
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/ubtbr'); import ubtbr"

    - name: Build with a strict C standard
      shell: bash
      # COMPATIBILITY.md claims the host tools build with -std=c17 and
      # -std=c2x on this pair of runners, and nothing made that true: the
      # build above uses the compiler's default, which is a GNU standard, and
      # a GNU standard defines _DEFAULT_SOURCE for us. On glibc that macro is
      # what declares usleep() and the <endian.h> byte-order helpers, so a
      # strict standard hid them and the build failed until host/CMakeLists.txt
      # asked for the macro by name. The next GNU-only call would reintroduce
      # exactly that, and only a user with CFLAGS of their own would find out.
      #
      # A hidden declaration is a hard error here, not a warning: that is how
      # a missing usleep() or be32toh() shows up, and macOS declares both
      # whatever the standard, so without this the Linux leg would warn and
      # the macOS leg would say nothing at all.
      #
      # A separate build tree per standard, so neither can be answered by an
      # object file the default build left behind. Compiling is the whole
      # point here, so these are built in parallel and their tests are not
      # run: the suite above already ran them once, and running it twice more
      # would cost minutes to tell us what the first run told us.
      run: |
        for std in c17 c2x; do
          dir="$GITHUB_WORKSPACE/host/build-$std"
          cmake -E make_directory "$dir"
          cmake -S "$GITHUB_WORKSPACE/host" -B "$dir" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_FLAGS="-std=$std -Werror=implicit-function-declaration"
          cmake --build "$dir" --config $BUILD_TYPE --parallel
        done

  # The tools built against an INSTALLED libubertooth, which is the other
  # supported way to configure them: host/ubertooth-tools/src/CMakeLists.txt
  # finds the library with FindUBERTOOTH.cmake when there is no library source
  # tree beside it, and the test directory has a branch of its own for every
  # target that would otherwise compile a library source. Nothing ever
  # configured that way, so none of those branches was reached and they could
  # rot unnoticed; this job reaches them on every pull request.
  #
  # Linux only. What it covers is which include directory a target is given,
  # which is the same on every platform, and the macOS leg of the host job
  # already builds and tests the whole tree the usual way. The macOS runners
  # also queue for an hour or more when several pull requests are open, and
  # this adds nothing a second platform would find.
  host-installed-libubertooth:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    # The install step below plus three builds: libbtbb, the whole host tree
    # (which is what installs the library), and the tools on their own with
    # their tests. Comfortably under the host job's 22, which does more.
    timeout-minutes: 18

    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: Install dependencies
      # The same packages, bound and retried the same way, as the host job.
      timeout-minutes: 10
      run: |
        packages="libfftw3-dev libusb-1.0-0-dev libbluetooth-dev"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        sudo tools/retry.sh 180 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d $packages"
        sudo apt-get install -y $packages

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -S "$GITHUB_WORKSPACE/libbtbb" -B "$GITHUB_WORKSPACE/libbtbb/build" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build "$GITHUB_WORKSPACE/libbtbb/build" --config $BUILD_TYPE
        sudo cmake --install "$GITHUB_WORKSPACE/libbtbb/build" --config $BUILD_TYPE

    - name: Install libubertooth
      shell: bash
      # The whole tree, built and installed the way the build guide gives, so
      # that the step below finds a libubertooth where a user who had run
      # `make install` would have one. ldconfig because the tools the step
      # below builds are run by its tests and link against it.
      #
      # Without the tests or the Python tools: all this build is here for is
      # the installed library, and the host job already builds and runs both.
      run: |
        cmake -S "$GITHUB_WORKSPACE/host" -B "$GITHUB_WORKSPACE/host/build" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DUBERTOOTH_RELEASE=ON \
          -DBUILD_TESTING=OFF -DENABLE_PYTHON=OFF
        cmake --build "$GITHUB_WORKSPACE/host/build" --config $BUILD_TYPE
        sudo cmake --install "$GITHUB_WORKSPACE/host/build" --config $BUILD_TYPE
        sudo ldconfig

    - name: Configure the tools against the installed library
      shell: bash
      # host/ubertooth-tools on its own, with no library source tree beside
      # it: no path to it is passed, so a configure that found one would mean
      # the tools had reached outside their own directory.
      #
      # No UBERTOOTH_RELEASE here, unlike the other host configures: whether
      # firmware of another API version is refused is decided in
      # libubertooth, so it is the install step above that passes it, and
      # passing it again here would only earn CMake's warning about a
      # variable the project never read.
      run: |
        cmake -S "$GITHUB_WORKSPACE/host/ubertooth-tools" \
          -B "$GITHUB_WORKSPACE/tools-build" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Check that it is the installed library that was found
      working-directory: ${{github.workspace}}/tools-build
      shell: bash
      # The whole job rests on this, and nothing else asserts it:
      # FindUBERTOOTH.cmake lists the source tree beside the tools among the
      # places it looks, which in this configuration is the very
      # host/libubertooth/src this is meant to be doing without. The system
      # prefix is searched first, so it finds the installed library -- but a
      # reordering, or an install step that silently did nothing, would leave
      # the job building against the source tree and reporting a pass.
      run: |
        found=$(sed -n 's/^LIBUBERTOOTH_INCLUDE_DIR:[^=]*=//p' CMakeCache.txt)
        echo "libubertooth header found at: $found"
        case "$found" in
          "") echo "error: no libubertooth header was found at all" >&2; exit 1 ;;
          "$GITHUB_WORKSPACE"/*)
            echo "error: that is this checkout, not an installed library" >&2
            exit 1 ;;
        esac

    - name: Build the tools
      shell: bash
      run: cmake --build "$GITHUB_WORKSPACE/tools-build" --config $BUILD_TYPE

    - name: Unit tests (tools against the installed library)
      working-directory: ${{github.workspace}}/tools-build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/tools-build
      shell: bash
      run: ./src/ubertooth-util -h

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Same tiers as the host job, and the same four places to keep in
        # step when the minimal tier changes.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    # Above the install step below plus the build, as in the host job. The
    # cold-run install step may take fourteen of these minutes on its own, and
    # the rebuild check at the end wants another two.
    timeout-minutes: 22

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    # The ARM toolchain is the big download in this workflow: 574 MB of
    # packages on Ubuntu 24.04, a cask of comparable size on macOS. A mirror
    # that stops sending bytes part way through used to leave this step
    # waiting until the job timeout, so each step is bounded as in the host
    # job.
    - name: Install dependencies (macOS)
      # Twelve minutes is well above what this step has ever legitimately
      # taken (four and a half on the oldest runner, where brew rebuilt a
      # dependency from source), and well below the job's own budget, so a brew
      # that never finishes fails here by name.
      timeout-minutes: 12
      run: |
        # Refresh cask definitions first: the gcc-arm-embedded cask pins a
        # SHA-256 that breaks whenever Arm bumps a point release before the
        # runner image's Homebrew catches up (checksum mismatch on download).
        brew update
        brew install --cask gcc-arm-embedded
        brew install dfu-util
        pip install PyYAML
      if: runner.os == 'macOS'

    # Bounding the download reports a slow mirror instead of waiting for it,
    # but it cannot make the download finish, and the download is large.
    # Measured on ubuntu-24.04 (noble, gcc-arm-none-eabi 13.2.rel1-2): 574 MB
    # for the four packages, 463 MB of it the C++ runtime
    # (libstdc++-arm-none-eabi-newlib), 57 MB the compiler itself and 49 MB
    # newlib. Only the compiler was counted when this job was first bounded,
    # which is why older notes about it say 94 MB; naming the two runtimes
    # explicitly, rather than taking them as recommends, is what made the real
    # figure visible.
    #
    # The same fetch took 31 seconds on a healthy mirror and, an hour later on
    # a bad one, moved 3 MB in 63 seconds and did not get through the compiler
    # in either attempt. Keeping the .deb files between runs is the only thing
    # that removes the download, so the two steps below do that and the fetch
    # beneath them is unchanged for the run that has to do it for real.
    #
    # The key is the set of files apt would fetch, not the package names.
    # apt-get --print-uris resolves the names against the runner image's
    # package index without downloading anything, so the key changes exactly
    # when the files behind those names change: a point release of the
    # compiler gets a new key, a cold download and a new cache, and CI goes
    # on building with the toolchain the distribution ships today. That is
    # what a pinned tarball from the vendor would have cost.
    #
    # No restore-keys: a near miss would hand apt an archive directory full
    # of .deb files it no longer wants, which it does not clean up, so the
    # saved cache would grow with every toolchain bump. A miss here is a
    # cold run, which is what the bound and the retry below are for.
    - name: Resolve the toolchain packages
      id: toolchain
      if: runner.os == 'Linux'
      # bash, not the default shell: GitHub's `bash` keyword adds -o pipefail,
      # so a failing apt-get in the pipeline below fails this step. Without it
      # the pipeline's status is sort's, the step would succeed with an empty
      # list, and the key would become the hash of nothing -- one constant that
      # matches every toolchain. Nothing downstream would complain, because the
      # install refetches whatever is missing, so the key would quietly stop
      # being a key.
      shell: bash
      run: |
        uris="$RUNNER_TEMP/toolchain-uris"
        # What is left of each line is the file name, its size and its hash;
        # the mirror URL in front of them is dropped, so a run sent to a
        # different mirror still matches the cache.
        sudo apt-get install --print-uris -y --no-install-recommends -d \
          $ARM_PACKAGES | sed -n "s/^'[^']*' //p" | sort > "$uris"
        cat "$uris"
        # The belt to pipefail's braces: a key may only be computed from a
        # list that has something in it. An empty list is a resolve that went
        # wrong, never a toolchain with no files.
        if [ ! -s "$uris" ]; then
          echo "error: apt resolved no files for the toolchain packages, so" >&2
          echo "       there is nothing to key the cache on" >&2
          exit 1
        fi
        echo "key=$(sha256sum < "$uris" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore the toolchain packages
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      # Its own limit, because restoring half a gigabyte from the cache
      # service is the one network fetch here that tools/retry.sh does not
      # wrap: a restore that stalls should fail a step that names it.
      timeout-minutes: 8
      with:
        path: ${{ runner.temp }}/apt-archives
        # No runner label in the key. Two images that resolve the same .deb
        # files want the same cache, and ubuntu-latest is ubuntu-24.04 today,
        # so keying on the label would have stored half a gigabyte twice and
        # left the canary with a cold run of its own in every steady-state
        # run. On the first run after a toolchain bump both miss together and
        # only one of them saves, so the canary pays a cold run that once;
        # the alternative is paying for a second copy forever.
        key: arm-toolchain-${{ steps.toolchain.outputs.key }}

    - name: Install dependencies (Ubuntu)
      # This step runs on every Linux run; it is the download inside it that
      # only the run finding nothing cached pays for. That download is what
      # the limit below is sized for, and one attempt has to fetch the whole
      # 574 MB, because a killed apt keeps only the
      # packages it had finished: in a run measured here, attempt two still
      # needed 571 MB of the 574. Five minutes an attempt therefore wants
      # about 2 MB a second, which a healthy mirror beats several times over
      # and a bad one does not come close to. A mirror that slow is reported
      # by name rather than waited on, which is the point of the bound; what
      # removes the wait altogether is the cache above.
      #
      # Fourteen minutes: tools/retry.sh's worst case here is 10 minutes 30,
      # and the rest is for unpacking half a gigabyte of toolchain, which must
      # not be cancelled half done.
      timeout-minutes: 14
      run: |
        archives="$RUNNER_TEMP/apt-archives"
        # apt needs the partial directory to exist before it will fetch.
        mkdir -p "$archives/partial"
        # APT::Sandbox::User=root stops apt dropping to the _apt user for the
        # download, which cannot read a directory under the runner's temp;
        # without it apt warns and silently fetches as root anyway.
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2 \
          -o Dir::Cache::archives=$archives -o APT::Sandbox::User=root"
        sudo tools/retry.sh 300 apt-get $apt_opts \
          install -y --no-install-recommends -d $ARM_PACKAGES
        sudo apt-get $apt_opts install -y --no-install-recommends $ARM_PACKAGES
        # apt wrote these as root; the cache is saved as the runner user.
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        du -sh "$archives"
      if: runner.os == 'Linux'

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Pure-C firmware logic compiled and run with the host compiler -- no ARM
      # toolchain or hardware needed. Fails the job on any assertion failure.
      run: make test

    - name: Build
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Build the compile/link targets (elf/bin/sym) per subdirectory. We skip
      # the default target's final `dfu` step because it shells out to the
      # `ubertooth-dfu` host tool and is only needed to package firmware for
      # flashing, not to verify that the firmware compiles and links.
      #
      # The bootloader is built through its own target in firmware/Makefile,
      # because it is the one image needing the ARM C++ runtime. Its link is
      # also the check that the image still fits: the linker script gives it a
      # 16 KiB region, and a build that outgrows it fails here rather than on a
      # board that will not boot, which matters because it is the one image
      # `ubertooth-dfu` cannot replace.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done
        echo "::group::firmware: bootloader"
        make bootloader
        echo "::endgroup::"
        # The bootloader updater carries the bootloader built above, so
        # it is built after it and through its own target for the same
        # reason: building it builds the bootloader.
        echo "::group::firmware: bl_update"
        make bl_update
        echo "::endgroup::"

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.os }}
        path: |
          ${{github.workspace}}/firmware/*/*.bin
          ${{github.workspace}}/firmware/*/*.elf
        if-no-files-found: error

    # The makefiles rebuild the objects when a compile flag changes and relink
    # when a linker script changes, so that a build after such an edit is not
    # the previous image. The firmware unit tests above can only read the
    # makefiles as text, which says the lines are there, not that they work.
    # This builds three images in a copy of the tree, changes one thing at a
    # time and looks at what was rewritten, which needs the ARM toolchain --
    # already installed for this job. Around a minute, most of it the builds
    # and the whole seconds the check has to wait out.
    #
    # After the upload on purpose, so a failure here still leaves the images
    # this job built to download, and still feeds the image-revision job.
    - name: Check that a flag or linker-script change rebuilds the firmware
      working-directory: ${{github.workspace}}
      shell: bash
      # Three times its worst observed run, and inside the slack the job has
      # left once the install and build steps have spent their own budgets, so
      # a check that hangs is reported as this step timing out and named,
      # rather than as the whole job running out of time.
      timeout-minutes: 3
      run: tools/check-firmware-rebuilds.sh

  # The scripts in tools/ are CI's own moving parts, and nothing used to lint
  # or test them: a mistake in one surfaced as a confusing failure in whatever
  # job happened to run it. Runs on both tiers, and on both platforms because
  # retry.sh takes an unbounded fallback wherever there is no timeout command,
  # which is every macOS runner and the one path nothing had ever run.
  # A documentation-only branch changes none of them, and is the one case
  # this job is skipped for.
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    # The steps below carry their own limits: 6 minutes each for the
    # shellcheck install, the api-version self-test (which builds and reads
    # seventy-odd throwaway repositories) and the DFU packaging self-test, 3
    # each for the issue-reference and documentation-version self-tests (which
    # build throwaway repositories too), and 2 each for the two libbtbb list
    # checks, the workflow libbtbb guard's self-test and the documentation
    # version check. The job's limit has to leave room for all of them to be
    # slow at once, which is 32 minutes of step limits plus the unbounded
    # steps -- the two quick self-tests and the issue-reference check -- so 38.
    timeout-minutes: 38
    steps:
    - uses: actions/checkout@v4

    - name: shellcheck
      # shellcheck is on GitHub's Ubuntu images already. Installing it on
      # macOS as well would cost a brew install to check the same files
      # twice, so the lint is the Linux leg's and the macOS leg is here for
      # the self-test below.
      #
      # The list comes from git rather than two fixed patterns, so a script
      # added in a new directory is linted without anyone remembering to widen
      # a glob here. It is every tracked `*.sh`, which is every shell script
      # the tree has; one named some other way, or with no extension, would
      # still need adding. An empty list fails the step, as it should: it
      # would mean the pathspec had stopped matching.
      if: runner.os == 'Linux'
      timeout-minutes: 6
      run: |
        # The runner image ships shellcheck, so this normally installs
        # nothing. If an image ever drops it, install it rather than have
        # every pull request blocked by a command that is not there; bounded
        # and retried like the other package installs in this workflow.
        if ! command -v shellcheck > /dev/null; then
          apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
          sudo tools/retry.sh 120 sh -c \
            "apt-get $apt_opts update && apt-get $apt_opts install -y -d shellcheck"
          sudo apt-get install -y shellcheck
        fi
        git ls-files -z '*.sh' | xargs -0 shellcheck

    - name: Check that retry.sh bounds, retries and reports
      # Not inline here, unlike the issue-reference check below, because the
      # self-test is long enough to want linting itself and to be worth
      # running by hand: it is one of the scripts the step above covers.
      run: tools/retry-selftest.sh

    - name: Check that the image revision check holds both ways
      # The image-revision job below runs that check against the images this
      # branch builds, which says nothing about whether it would still refuse
      # an image the tool cannot read a revision out of. This writes throwaway
      # images in each of the shapes that matter -- no info block, a format
      # the host does not know, an empty or unprintable revision, a block
      # naming another image, a shipped image that was not built -- and
      # asserts the status and the message for each. It needs a C compiler and
      # nothing else: no ARM toolchain, no board, no network, under a minute.
      run: tools/check-image-revision-selftest.sh

    - name: Check that the firmware API version check holds both ways
      # The api-version job below runs main's copy of that check, so on a pull
      # request this step is the only place the branch's own copy runs at all:
      # it is what shows that a change to the check still refuses a bad
      # branch, before that change reaches main and starts gating others. This
      # builds throwaway repositories in each of the shapes the rule names --
      # a claimed version, a stray bump, a comment dressed up as a firmware
      # change, a value that is not binary-coded decimal, a header it cannot
      # read -- and asserts the status, the stream and the message for each.
      # It needs no network. Around a minute: it is fifty-odd `git init`s.
      timeout-minutes: 6
      run: tools/check-api-version-selftest.sh
    - name: Check that the DFU packaging check holds both ways
      # Same split and the same bound as the step above. The dfu-package job
      # below packages the real images with the real tool, which shows the
      # check passing and says nothing about whether it would still refuse a
      # .dfu the tool cannot flash -- and a release that broke packaging is
      # exactly when nobody can ask CI to try it. This packages with
      # stand-ins that write
      # a wrong vendor or product, a wrong signature, a corrupted CRC, no
      # firmware, no file at all, or other firmware than they were given, and
      # asserts the status and the message for each. A C compiler and nothing
      # else: no ARM toolchain, no host build, no board, no network.
      timeout-minutes: 6
      run: tools/check-dfu-package-selftest.sh

    - name: Check that the workflow libbtbb guard holds both ways
      # The libbtbb-pin workflow runs that guard against this branch, which
      # says nothing about whether it would still refuse a workflow that
      # fetches a libbtbb of its own. This copies the real workflows into
      # throwaway directories -- one with a job fetching upstream, one with a
      # job cloning another fork, one with the pin-reading file drifted, and
      # ones holding only the local libbtbb paths the real jobs write -- and
      # asserts the status and the message for each. It reads files: no
      # network, no build, a second or two.
      timeout-minutes: 2
      run: tools/check-workflow-libbtbb-selftest.sh

    - name: Check that the issue-reference check holds both ways
      # The step further down plants a reference and shows it is caught, which
      # says nothing about the other direction: whether a tree with nothing to
      # report is reported clean, and whether a scan that could not read a
      # file says so instead of passing. Both are how the status of the scan
      # was misread for as long as the check has existed. This builds
      # throwaway repositories -- a clean one, ones with a reference in a
      # source file, in a per-directory build file and as a full URL, one
      # missing a tracked file, one with too few files in scope -- and asserts
      # the status, the stream and the message for each. Both platforms,
      # because the two xargs implementations disagree about exactly this.
      # A few seconds of git init: no build, no network.
      timeout-minutes: 3
      run: tools/check-issue-references-selftest.sh

    - name: Check the documentation does not pin the API version
      # Sample output writes the version as API:<version>, so that a bump has
      # one place to change; TEST_PLAN.md and COMPATIBILITY.md carry the real
      # number, so this also asks whether those two are at the version the
      # tree carries. Before this step the rule was kept by review, and the
      # samples that went stale were found two bumps later. It reads files:
      # no build, no network, a second or two.
      timeout-minutes: 2
      run: tools/check-doc-api-version.sh

    - name: Check that the doc API version check holds both ways
      # The step above runs the check against this branch, which says nothing
      # about whether it would still refuse a pinned version, or still excuse
      # the numbers that are deliberate -- btbr's fixed 1.06, the 2020-12-R1
      # release's 1.07, and the two documents that state the requirement. An
      # allowlist too wide passes the stale samples the check exists to find.
      # This builds throwaway repositories in each of those shapes -- pinned
      # in the README, in a man page's Markdown, in a hand-maintained roff
      # page, 1.06 borrowed by a bluetooth_rxtx sample, a stale TEST_PLAN.md,
      # a COMPATIBILITY.md that never mentions the version, a header the
      # version cannot be read from -- and asserts the status, the stream and
      # the message for each. Both platforms, because the two xargs and sed
      # implementations disagree about exactly this kind of work.
      # A few seconds of git init: no build, no network.
      timeout-minutes: 3
      run: tools/check-doc-api-version-selftest.sh

    - name: Check the libbtbb function list
      # FindBTBB.cmake probes the installed libbtbb for the functions the host
      # sources call, so an old one is refused by name at configure time. That
      # only keeps answering for the whole tree while its list matches the
      # calls, and nothing in a build notices when it stops. Both platforms,
      # because the script is sed and awk and the two legs disagree about
      # those.
      timeout-minutes: 2
      run: tools/check-btbb-symbols.sh

    - name: Check that the list check still catches a difference
      # So the step above cannot pass because the list or the scan has stopped
      # being read. Both directions: a name dropped from the list has to be
      # reported as a call the list is missing, and a name added to it that
      # nothing calls has to be reported as a function no installed libbtbb
      # should be asked for. The step edits the module in place, so every exit
      # path below puts the original back and the checkout is left as it was
      # found; the check's own output goes to the runner's temporary directory
      # rather than into the tree.
      shell: bash
      timeout-minutes: 2
      run: |
        module=host/cmake/modules/FindBTBB.cmake
        out=$RUNNER_TEMP/btbb-symbols.out
        dropped=$(sed -n '/^set(LIBBTBB_REQUIRED_FUNCTIONS$/,/^)$/p' "$module" |
                  sed -n 's/^  \([a-z_][a-z0-9_]*\)$/\1/p' | head -1)
        : "${dropped:?no function name to drop from $module}"

        # A name the list has and the sources call, taken out of the list.
        sed -i.bak "/^  $dropped\$/d" "$module"
        status=0
        tools/check-btbb-symbols.sh > "$out" 2>&1 || status=$?
        mv "$module.bak" "$module"
        if [ "$status" -eq 0 ]; then
          echo "the check passed with $dropped removed from $module" >&2
          exit 1
        fi
        grep -q "^  $dropped\$" "$out" || {
          echo "the check failed, but did not report $dropped:" >&2
          cat "$out" >&2
          exit 1
        }

        # A name nothing calls, added to the list. btbb_ so it is scanned for
        # the way a real one would be. Added with awk rather than sed, because
        # sed's insert command is not written the same way on both of the
        # platforms this job runs on; the check sorts the list itself, so the
        # last line is as good a place as any.
        added=btbb_not_a_real_function
        cp "$module" "$module.bak"
        awk -v add="  $added" '
          $0 == ")" && inlist { print add; inlist = 0 }
          /^set\(LIBBTBB_REQUIRED_FUNCTIONS$/ { inlist = 1 }
          { print }
        ' "$module.bak" > "$module"
        grep -qx "  $added" "$module" || {
          echo "could not add $added to $module" >&2
          mv "$module.bak" "$module"
          exit 1
        }
        status=0
        tools/check-btbb-symbols.sh > "$out" 2>&1 || status=$?
        mv "$module.bak" "$module"
        if [ "$status" -eq 0 ]; then
          echo "the check passed with $added added to $module" >&2
          exit 1
        fi
        grep -q "^  $added\$" "$out" || {
          echo "the check failed, but did not report $added:" >&2
          cat "$out" >&2
          exit 1
        }
        echo "The check catches a function dropped from the list and one added to it."

  # Stand-ins for the three jobs above, so each name a pull request is gated
  # on reports even on a branch that gives those jobs nothing to do.
  #
  # A job skipped by its own `if:` does report a check, and a protection rule
  # counts a skipped check as passed -- but GitHub does not expand the matrix
  # of a job it skips. A skipped `host` reports once, as `host`, and not as
  # `host (ubuntu-24.04)` and `host (macos-26)`, which are the names the rule
  # on main requires. Without the stand-ins, a firmware-only branch would wait
  # forever for two host names nothing was going to report, and a
  # documentation-only branch for six.
  #
  # So each stand-in carries the same `name:` as a leg of the job it stands in
  # for and runs on the opposite condition: exactly one of the pair reports
  # each name, the real job when that side changed and the stand-in when it
  # did not. A stand-in builds nothing and claims nothing about the code; it
  # says in its log which job did not run and why. All of them run on Linux,
  # including the ones named for a macOS runner, because a stand-in has
  # nothing platform-specific to do and a macOS runner can queue for an hour.
  #
  # The matrix is also what keeps a stand-in from ever masking a real failure.
  # GitHub does not evaluate the name of a job it skips any more than it
  # expands its matrix, so a skipped stand-in reports under the unevaluated
  # `host (${{ matrix.os }})` rather than under a leg's name. That entry is
  # cosmetic and nothing requires it; what matters is that no pull request can
  # ever have two check runs of the same name, one of them a stand-in's pass.
  # Three jobs named for one leg each would report that pair, and a protection
  # rule reading whichever arrived last would be a hole rather than a gate.
  #
  # The matrix in each is the minimal tier's, spelled out: a stand-in can only
  # run on a pull request, since `changes` reports every side as changed for
  # every other event, and a pull request is always the minimal tier. A
  # workflow cannot share one list between two `strategy` blocks, so these
  # repeat the lists above -- see the note at the host job's matrix.
  host-skipped:
    name: host (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.host != 'true'
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Nothing to build
      run: |
        echo "Every file this pull request changes is under firmware/ or is"
        echo "documentation, so the host build did not run on ${{ matrix.os }}."

  firmware-skipped:
    name: firmware (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.firmware != 'true'
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Nothing to build
      run: |
        echo "This pull request changes no firmware, no workflow and not the"
        echo "shared USB interface header, so the firmware build did not run"
        echo "on ${{ matrix.os }}."

  scripts-skipped:
    name: scripts (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.scripts != 'true'
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Nothing to lint
      run: |
        echo "This pull request changes only documentation, so the shell"
        echo "scripts were not linted or self-tested on ${{ matrix.os }}."

  # Issue and pull request numbers must not appear in source, tests or build
  # files (.kiro/steering/branch-and-review.md). A reviewer who happens to know
  # the rule is the only thing that caught the last ones, and only after they
  # had merged. Runs on both tiers: it takes seconds and needs nothing built.
  issue-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Check for issue numbers in source, tests and build files
      run: tools/check-issue-references.sh

    - name: Check that the check still catches one
      # So the step above cannot pass because the scan stopped reaching the
      # files. One plant per kind of file the rule names: a source file, a
      # CMake build file and a Makefile, since the per-directory build files
      # are reached by a different pathspec from the sources and were missed
      # once already. The plants are thrown away with the runner.
      #
      # The number is held in a variable because this workflow is itself a
      # build file the scan reads, and a literal would be a reference of
      # exactly the kind it refuses.
      run: |
        planted=4242
        for file in host/libubertooth/src/ubertooth.c \
                    host/CMakeLists.txt \
                    firmware/bluetooth_rxtx/Makefile; do
          printf '# see #%s\n' "$planted" >> "$file"
          if tools/check-issue-references.sh > planted.out 2>&1; then
            echo "the check passed with a reference planted in $file" >&2
            exit 1
          fi
          grep -q "$file:.*#$planted" planted.out || {
            echo "the check failed, but not on the line planted in $file:" >&2
            cat planted.out >&2
            exit 1
          }
          git checkout -- "$file"
          echo "caught in $file"
        done
        rm -f planted.out
        echo "The check catches a planted reference in source and build files."

  # `ubertooth-dfu -r` checks, after the reset, that the board came back
  # running the revision just written, and it learns which revision to expect
  # from the FILE: it reads the firmware info block the image carries. An
  # image whose block it cannot read is refused before anything is erased, so
  # the documented way to flash it stops working -- which happened to the btbr
  # image, and was found at the bench rather than here.
  #
  # firmware/common.mk compares the eight magic bytes at the offset with dd,
  # which catches a build that lost the block entirely. Everything else the
  # tool's own parse insists on -- a format version it knows, an image name
  # and a revision that are non-empty and printable -- is only checked by
  # running that parse, and nothing ran it on a built image.
  #
  # This job runs it: the images the firmware job built, on every runner it
  # built them on, handed to the host's own reader. It builds nothing itself,
  # so it costs a checkout, a download and a few seconds of compiler.
  #
  # The revision is all it checks. The firmware job builds no .dfu -- that
  # step shells out to the host tool it does not build -- so these are .bin
  # files, and `ubertooth-dfu` would refuse a .bin on the DFU suffix long
  # before reading a block out of it. The suffix on the packaged file is the
  # dfu-package job below.
  image-revision:
    # Every leg of the firmware matrix, so a toolchain that spoils the block
    # on one platform only is still caught. A firmware job that failed skips
    # this one rather than reporting a second, derived failure.
    needs: firmware
    runs-on: ubuntu-24.04
    # Above the download's own four minutes plus the checkout, the compile and
    # the check, so a download that nearly used its budget still fails on its
    # own clock rather than this one.
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4

    - name: Download the built firmware images
      uses: actions/download-artifact@v4
      # Its own limit: the download is the one thing here that could stall,
      # and the artifacts are a few hundred kilobytes.
      timeout-minutes: 4
      with:
        pattern: firmware-*
        path: images

    - name: Check that each shipped image carries a readable revision
      # --from finds every shipped image under the downloaded artifacts and
      # fails on one that is missing as well as on one whose block cannot be
      # read, so an image that stopped being built does not pass as nothing
      # to do. It also refuses a tree with a firmware directory none of its
      # lists classifies, so a new image has to be called shipped or
      # bench-only before this goes green.
      run: tools/check-image-revision.sh --from images

  # A board is accepted only if it reports exactly UBERTOOTH_API_VERSION, so a
  # branch that changes the firmware interface has to take a version main has
  # not used. Two pull requests set it to the value main had just taken, and
  # nothing noticed either time: the rule was checked by hand, with a command
  # nobody ran. Runs on both tiers, like the check below, and needs nothing
  # built. tools/check-api-version-selftest.sh, run by the scripts job above,
  # is what shows the check still refuses a bad branch.
  #
  # This job only compares a branch with main, so it runs where there is a
  # branch to compare: see the condition below.
  api-version:
    # Pull requests and pushes to main only. On the weekly schedule, a
    # release or a manual run, HEAD is main's tip and the comparison below
    # would be main against itself: a green that proves nothing, and a red
    # weeks after the commit that nobody is going to fix.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        # The branch's own tip, not the merge commit GitHub builds for a pull
        # request. That commit already carries main, so its merge base with
        # main is main's tip, and the version at the merge base -- half of
        # what the rule compares -- would be main's rather than the branch's.
        # refs/pull/<number>/head rather than the head commit's hash, because
        # a pull request from a fork has that hash only in the fork. On a push
        # the commit itself, so the result cannot be attributed to a commit it
        # did not read: github.ref would be the branch as it is at clone time.
        ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
        # The check reads the header at three commits and needs a merge base,
        # so a shallow checkout is not enough. Every way of reading nothing is
        # a failure in that script rather than a pass, so a checkout that went
        # wrong here reports itself instead of going quietly green.
        fetch-depth: 0

    - name: Fetch main
      # By name, because the check compares against main as it is now, not as
      # the checkout above happened to leave it. Bounded and retried like
      # every other network fetch in this workflow, so a slow moment at the
      # remote does not red a gating job: 60 seconds an attempt, 2 minutes 30
      # at worst.
      if: github.event_name == 'pull_request'
      run: tools/retry.sh 60 git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

    - name: Check the firmware API version against main
      # On a push to main the commit being checked IS main, so the comparison
      # is with what main was before the push. That is the backstop for the
      # gap a pull request check cannot close: a branch whose check passed
      # before another branch merged the same value is merged without
      # re-running, and this catches it on the merge rather than in the next
      # release's firmware.
      #
      # github.event.before covers the whole push rather than its last commit.
      # It is all zeroes for the first push to a new branch, which main is not,
      # and it can name a commit this clone does not have after a force-push:
      # HEAD~1 in either case, which still checks the tip.
      #
      # On a pull request the script that does the checking comes from main,
      # not from the branch being checked. Everything else about this job --
      # the condition above, which commit is read, the watched list inside the
      # script -- used to come from the branch too, so a branch could edit the
      # check that gates it and go green. Reading the script from main closes
      # the script half of that: a branch's own edits to it are still reviewed
      # and still exercised, by tools/check-api-version-selftest.sh in the
      # scripts job, but they do not decide whether this job passes.
      #
      # The job-definition half cannot be closed from inside the workflow,
      # because GitHub reads the workflow file from the branch. Branch
      # protection is where that is answered.
      #
      # On a push to main the branch IS main, so there is nothing to read from
      # elsewhere.
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        set -eu
        : "${RUNNER_TEMP:?}"
        check=tools/check-api-version.sh
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # No fallback to the branch's own copy. main has the script, so the
          # only way to get here is a branch that renamed or deleted it --
          # $check comes from the branch too -- or an origin/main that did not
          # resolve. Running the branch's copy then would quietly put the
          # branch back in charge of the check that gates it, which is the
          # whole point of reading it from main. A rename lands by merging it
          # to main first.
          if ! git cat-file -e "origin/main:$check" 2> /dev/null; then
            echo "error: origin/main has no $check, so there is no copy of the" >&2
            echo "       check to run that this branch did not write. Rename or" >&2
            echo "       remove it on main first, and fetch main if that is what" >&2
            echo "       is missing here." >&2
            exit 1
          fi
          from_main="$RUNNER_TEMP/check-api-version-from-main.sh"
          git show "origin/main:$check" > "$from_main"
          chmod +x "$from_main"
          echo "note: running $check as origin/main has it" >&2
          "$from_main" origin/main
        elif git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
          "$check" "$BEFORE"
        else
          echo "note: $BEFORE is not a commit here; comparing with HEAD~1" >&2
          "$check" HEAD~1
        fi
  # The .dfu is the file every install guide tells users to flash, and nothing
  # outside a developer's own tree used to build one. The firmware build ends
  # in a packaging step that shells out to `ubertooth-dfu -s`
  # (firmware/common.mk: `%.dfu: %.bin`), which the firmware job cannot run
  # because it builds no host tool, so the images CI produced were .bin files
  # nobody packaged.
  #
  # `ubertooth-dfu -d` validates the DFU suffix before it reads anything else
  # out of a file: the suffix length, the DFU version, the signature, a
  # payload that is not empty, the CRC over the whole file, and the USB vendor
  # and product the suffix names. A change that broke the packaging step or
  # the suffix layout left every job green and surfaced the first time someone
  # flashed a board. (A change to the two USB IDs themselves is the scripts
  # job's self-test: packaging and check both read them from the same header,
  # so only a test that spells the numbers out can see it.)
  #
  # So this packages the images the firmware job built with the real tool and
  # runs each packaged file through the host's own dfu_image_check(). It is
  # also the only job that builds a host tool against the firmware the same
  # run produced.
  #
  # One Linux runner, where image-revision reads the .bin on every leg of the
  # firmware matrix: a DFU suffix is bytes in a file, written by host code
  # that the host job compiles and unit-tests on every supported platform, so
  # a second runner here would package the same bytes again.
  dfu-package:
    # A firmware job that failed skips this one rather than reporting a
    # second, derived failure.
    needs: firmware
    runs-on: ubuntu-24.04
    # Above the sum of the bounded steps below -- ten minutes for the install
    # and four for the download -- plus the two checkouts and the two cmake
    # builds, so a slow package mirror fails the step that names it rather
    # than being cancelled with the job and read as a broken build.
    timeout-minutes: 22
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    # libusb and libbtbb are what libubertooth needs; no BlueZ and no FFTW,
    # because only ubertooth-dfu is built. Bounded and retried like the other
    # package installs in this workflow.
    - name: Install dependencies
      timeout-minutes: 10
      run: |
        packages="libusb-1.0-0-dev"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        sudo tools/retry.sh 180 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d $packages"
        sudo apt-get install -y $packages

    - name: (libbtbb) Build and install
      shell: bash
      # ENABLE_PYTHON=OFF as in the host job: only the C library is linked.
      run: |
        cmake -S libbtbb -B libbtbb/build -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DENABLE_PYTHON=OFF
        cmake --build libbtbb/build --config $BUILD_TYPE
        sudo cmake --install libbtbb/build --config $BUILD_TYPE

    - name: Build ubertooth-dfu
      shell: bash
      # Only the packaging tool, not the whole tool set: the host job builds
      # and tests all of them on every supported platform.
      run: |
        cmake -S host -B host/build -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DUBERTOOTH_RELEASE=ON
        cmake --build host/build --target ubertooth-dfu

    - name: Download the built firmware images
      uses: actions/download-artifact@v4
      # Its own limit, as in image-revision: the download is the one thing
      # here that could stall, and the artifacts are a few hundred kilobytes.
      timeout-minutes: 4
      with:
        pattern: firmware-*
        path: images

    - name: Package each shipped image and check the packaged file
      # --from finds every shipped image under the downloaded artifacts and
      # fails on one that is missing as well as on one whose .dfu the tool
      # would refuse, so an image that stopped being built does not pass as
      # nothing to do.
      run: |
        tools/check-dfu-package.sh \
          --dfu-tool host/build/ubertooth-tools/src/ubertooth-dfu \
          --from images

  # Ubuntu 20.04 is the oldest supported Linux. GitHub retired the hosted
  # ubuntu-20.04 runner, so run it in a container on a current runner. The
  # container is root (no sudo) and starts bare, so install git/toolchain.
  host-ubuntu-20_04:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Above the bounded install step below plus the libbtbb and host builds.
    timeout-minutes: 18
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    # Checked out first, so the install below can be bounded and retried by
    # tools/retry.sh rather than only bounded. The container has no git yet,
    # so actions/checkout fetches a tarball through the API instead of
    # cloning; nothing in this job reads the history.
    - uses: actions/checkout@v4

    - name: Install build prerequisites
      # This list is far larger than the firmware job's -- build-essential
      # alone pulls in the compiler and the C library headers -- so an
      # attempt gets 240 seconds rather than that job's 120. That is 8
      # minutes 30 of retries at worst, and then the install, which is why
      # the step gets twelve minutes and not ten: unpacking a compiler must
      # not be cancelled part way.
      timeout-minutes: 12
      run: |
        packages="git cmake build-essential pkg-config libfftw3-dev \
          libusb-1.0-0-dev libbluetooth-dev python3"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        # Refreshing the index and fetching the packages is one unit to
        # retry: an attempt that skipped the refresh would keep failing on
        # whatever made the last one fail. The install that follows is not
        # bounded, because a command killed while unpacking leaves dpkg
        # half-done and no retry can repair that.
        tools/retry.sh 240 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d $packages"
        apt-get install -y $packages

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DUBERTOOTH_RELEASE=ON
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h

  firmware-ubuntu-20_04:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Above the two install steps below plus the checkout and the build. Those
    # two steps may want twenty of these minutes between them on the day the
    # mirror is bad, and this job never has a cache to fall back on.
    timeout-minutes: 24
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    # Installed in two steps so the toolchain download gets the same
    # stalled-mirror guard as the hosted firmware job: tools/retry.sh comes
    # from the checkout, and the checkout needs git first. Both steps skip
    # recommends as the firmware job does; ca-certificates is then needed
    # explicitly for the HTTPS checkout of the submodules.
    - name: Install checkout prerequisites
      # Two bounded commands of 100 seconds, so 3 minutes 40 at worst, and
      # then the install of git and the certificates.
      timeout-minutes: 6
      # Not retried: tools/retry.sh needs the checkout this step installs for.
      # tools/retry.sh really is unavailable here, but timeout is not, so the
      # two downloads are bounded and say what happened, without being retried.
      run: |
        # 124 is the limit being reached, 137 the status of a command that
        # had to be killed at it. Any other failure is apt's own and has
        # printed its reason, so only the limit needs explaining.
        bounded() {
          timeout --kill-after=10s 100 "$@" && return 0
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "error: '$*' never finished; the package mirror has stalled" >&2
          fi
          exit 1
        }
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        bounded apt-get $apt_opts update
        bounded apt-get $apt_opts install -y --no-install-recommends -d \
          ca-certificates git
        apt-get install -y --no-install-recommends ca-certificates git

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install the ARM toolchain
      # The same toolchain as the hosted firmware job, so the same 300 seconds
      # an attempt and the same 14 minutes for the step. Not cached as that
      # job's is: this one runs on the weekly schedule, and a cache goes
      # unused for the same seven days after which GitHub evicts it, so the
      # hit would be a coin toss. This job therefore always pays the cold
      # download, which is the other reason the step limit is generous.
      timeout-minutes: 14
      run: |
        packages="make $ARM_PACKAGES"
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        tools/retry.sh 300 apt-get $apt_opts \
          install -y --no-install-recommends -d $packages
        apt-get install -y --no-install-recommends $packages

    - name: Build firmware
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # The bootloader goes through its own target, for the reasons in the
      # firmware job above.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done
        echo "::group::firmware: bootloader"
        make bootloader
        echo "::endgroup::"
        # The bootloader updater carries the bootloader built above, so
        # it is built after it and through its own target for the same
        # reason: building it builds the bootloader.
        echo "::group::firmware: bl_update"
        make bl_update
        echo "::endgroup::"

  # Fedora as an early-warning canary: it ships newer CMake/Python/GCC sooner
  # than Ubuntu, so breakage shows here first. Hard-fails on the weekly
  # schedule (drift email), soft-fails on release and manual runs. Run in a
  # container (no hosted Fedora).
  host-fedora:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # As in the Ubuntu 20.04 container above.
    timeout-minutes: 18
    container: fedora:latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
    # Checked out first, for the reason given in the Ubuntu 20.04 job above.
    - uses: actions/checkout@v4

    - name: Install build prerequisites
      # The same 240 seconds an attempt and the same twelve minutes for the
      # step as the Ubuntu 20.04 container, for the same reasons: a long
      # package list, and an rpm transaction that must not be cancelled part
      # way through.
      timeout-minutes: 12
      run: |
        packages="git cmake gcc gcc-c++ make pkgconf-pkg-config \
          fftw-devel libusb1-devel bluez-libs-devel python3"
        # dnf has no separate download command here, so the fetch is split
        # off with --downloadonly and keepcache makes the install that
        # follows local. Only the fetch is bounded: killing a download costs
        # nothing, killing an rpm transaction leaves the database to repair.
        tools/retry.sh 240 dnf -y --setopt=keepcache=1 install \
          --downloadonly $packages
        dnf -y --setopt=keepcache=1 install $packages

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE
        ldconfig || true

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DUBERTOOTH_RELEASE=ON
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h
