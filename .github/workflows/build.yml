name: Build

on:
  # Branches get CI through their pull request, so a push to a PR branch does
  # not run everything twice. Every push to main still runs.
  push:
    branches: [main]
    # Documentation and agent-rule changes do not need a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.kiro/**'

  # Full tier: weekly, on a published release, or on demand.
  schedule:
    - cron: 1 12 * * 1
  release:
    types: [published]
  workflow_dispatch:

# A newer commit on the same pull request cancels that PR's older run. Pushes
# to main and the weekly schedule get a unique group (the run id), so they are
# never cancelled or replaced and each main commit keeps its result. The group
# uses the PR number, so same-named branches from forks cannot collide.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two tiers, to keep pull requests fast and cheap:
# - Minimal (pull requests, pushes to main): host and firmware on one Linux
#   and one macOS runner.
# - Full (weekly schedule, published release, manual run): the whole supported
#   matrix, the *-latest canary, the Ubuntu 20.04 containers and Fedora. The
#   release run is a record after publishing, not a gate: run the full tier
#   manually (this workflow and install-sh.yml) before cutting a release.
# install.sh has its own workflow (install-sh.yml) that runs on PRs only when
# install.sh changes. A tier-dependent matrix must use the github context
# (env is not available in strategy), so the full-tier test is repeated below.
env:
  BUILD_TYPE: Release
  # libbtbb comes from this project's fork, pinned to a commit so a push there
  # cannot change an ubertooth build. This is the place to bump it: every job
  # below fetches that commit, and the "Check the libbtbb pin" step names the
  # other files that write it out and fails until they agree.
  LIBBTBB_REPO: SqueakyFloors/libbtbb
  LIBBTBB_REF: b32cf5adde496548057fdf6ea7c852378ad7411a

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        # Full tier: the pinned supported matrix plus the ubuntu-latest canary
        # (early warning for OS/toolchain breaks). Minimal tier: one Linux and
        # one macOS runner.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    # Above what the two bounded steps below can take together, so one that
    # overruns fails itself and names what stalled, rather than being
    # cancelled along with the job.
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Check the libbtbb pin
      shell: bash
      # It clones libbtbb, so it waits on the network like the install steps:
      # 60 seconds an attempt is at most 3 minutes 45 seconds.
      timeout-minutes: 5
      # Two things have to hold for the pin: every file that writes it out
      # agrees, and the commit is one a user can actually get.
      run: |
        status=0

        # The pin above is written out again in every file that builds libbtbb
        # or states which one this fork uses. Fail here, naming the file, rather
        # than let one of them drift to another libbtbb.
        for f in install.sh COMPATIBILITY.md \
                 docs/source/build_guide.rst docs/source/building_from_git.rst; do
          grep -q "$LIBBTBB_REF" "$f" || {
            echo "error: $f does not name the pinned libbtbb commit $LIBBTBB_REF" >&2
            status=1
          }
          grep -q "$LIBBTBB_REPO" "$f" || {
            echo "error: $f does not name the pinned libbtbb repository $LIBBTBB_REPO" >&2
            status=1
          }
        done

        # Agreeing on a commit is not enough: it has to be a commit a clone
        # can reach. GitHub keeps serving a pull request's head commit by its
        # hash even after that branch is deleted, so the checkouts below would
        # fetch it happily while every user following install.sh or a build
        # guide -- git clone, then git checkout <commit> -- gets "unable to
        # read tree". Clone the way they do and require the pin to be an
        # ancestor of the default branch.
        #
        # The clone is removed inside the retried command, because an attempt
        # that had to be killed leaves the directory behind and git refuses to
        # clone into one that is not empty.
        clone="$RUNNER_TEMP/libbtbb-pin.git"
        tools/retry.sh 60 sh -c 'rm -rf "$1" && git clone --quiet --bare "$2" "$1"' \
          clone-libbtbb "$clone" "https://github.com/$LIBBTBB_REPO"
        branch=$(git -C "$clone" symbolic-ref --short HEAD)

        # Requiring the default branch is stricter than a user needs, since a
        # full clone brings down the other branches too. That is deliberate:
        # install.sh and the guides promise a commit of the released library,
        # not whatever a side branch holds today.
        if ! git -C "$clone" merge-base --is-ancestor "$LIBBTBB_REF" "$branch" 2> /dev/null; then
          echo "error: libbtbb commit $LIBBTBB_REF is not on $LIBBTBB_REPO's" >&2
          echo "       $branch branch, so it is not a released commit: a merged" >&2
          echo "       pull request head whose branch is gone is served to CI by" >&2
          echo "       its hash but is in nobody's clone, and a side branch moves." >&2
          echo "       Pin a commit merged to $branch." >&2
          status=1
        fi

        # So the assert above cannot pass by having stopped comparing, which
        # is how the gap it closes went unnoticed in the first place. The
        # control is the tip of a branch the clone holds but $branch does not,
        # so refusing it takes a real ancestry comparison and not a missing
        # object -- which is what a hard-coded commit would have given, since
        # a bare clone does not fetch one that no branch points at.
        control=$(git -C "$clone" for-each-ref --format='%(objectname)' \
                    --no-merged "$branch" refs/heads | head -n 1)
        if [ -z "$control" ]; then
          echo "error: $LIBBTBB_REPO has no branch off $branch, so there is" >&2
          echo "       nothing to show the check above still refuses anything" >&2
          status=1
        elif git -C "$clone" merge-base --is-ancestor "$control" "$branch" 2> /dev/null; then
          echo "error: the check above accepted $control, which is not on" >&2
          echo "       $branch, so it is no longer checking anything" >&2
          status=1
        fi
        rm -rf "$clone"

        exit $status

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    # Every install step is given a timeout-minutes of its own, so a package
    # source that stops sending bytes fails a step that names it instead of
    # hanging until the job timeout cancels the job, where it reads as a
    # broken build. On apt that limit is tightened and retried per attempt by
    # tools/retry.sh; brew is left alone, because on an older runner it
    # legitimately builds a dependency from source for minutes at a time and
    # no short limit can tell that apart from a stall.
    #
    # On apt only the downloads are wrapped, never the installation that
    # follows: a command killed while unpacking would leave dpkg half-done,
    # which no retry can repair.
    - name: Install dependencies (macOS)
      # One bottle, where the firmware job runs several brew commands, so this
      # needs far less room than the 12 minutes that step is given.
      timeout-minutes: 8
      run: brew install fftw
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      # libbluetooth-dev is what ubertooth-scan and ubertooth-follow need:
      # without it cmake skips both tools, so nothing on Linux CI compiled
      # them or ran their CLI tests. macOS has no BlueZ, so there they stay
      # skipped by design.
      # Two bounded calls of 60 seconds an attempt, so at most 3 minutes 45
      # seconds each and 7 minutes 30 seconds for the pair, which this is
      # above.
      timeout-minutes: 8
      # sudo is outside the helper so the limit lands on apt itself: killing
      # sudo would leave apt holding the dpkg lock.
      run: |
        packages="libfftw3-dev libusb-1.0-0-dev libbluetooth-dev"
        sudo tools/retry.sh 60 apt-get update
        sudo tools/retry.sh 60 apt-get install -y -d $packages
        sudo apt-get install -y $packages
      if: runner.os == 'Linux'

    - name: (libbtbb) Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/libbtbb/build

    - name: (libbtbb) Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/libbtbb/build
      # ENABLE_PYTHON=OFF skips libbtbb's pcaptools: ubertooth links only the C
      # library, and building the Python tools adds a pip wheel build and a
      # pip install into the CI prefix that nothing here uses.
      run: cmake $GITHUB_WORKSPACE/libbtbb/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF

    - name: (libbtbb) Build
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: (libbtbb) Install
      working-directory: ${{github.workspace}}/libbtbb/build
      shell: bash
      run: sudo cmake --install . --config $BUILD_TYPE

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/host/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/host/build
      # On macOS, Homebrew puts libusb headers under $(brew --prefix)/include
      # (/opt/homebrew on Apple Silicon, /usr/local on Intel), which is not on
      # the compiler's default search path, so `#include <libusb-1.0/libusb.h>`
      # fails even though cmake finds the library via pkg-config.
      run: |
        EXTRA_C_FLAGS=""
        if [ "${{ runner.os }}" = "macOS" ]; then
          EXTRA_C_FLAGS="-I$(brew --prefix)/include"
        fi
        cmake $GITHUB_WORKSPACE/host/ -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_C_FLAGS="$EXTRA_C_FLAGS"

    - name: Build
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # Not a unit test: just confirm a built binary executes and prints usage
      # without a device. ubertooth-util -h is device-less and exits 0; most
      # other tools' -h opens the device first and exits non-zero on a runner.
      run: ./ubertooth-tools/src/ubertooth-util -h

    - name: Capture-to-stdout smoke test
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      # No device is present: option parsing still emits a complete 24-byte PCAP
      # global header before device open fails. This verifies binary stdout is
      # unpolluted on every Linux/macOS runner. The capture needs a mode to run
      # in, since a command line with no work in it is refused before any
      # capture file is opened; -r - is refused while the options are read, so
      # it needs none.
      run: |
        set +e
        ./ubertooth-tools/src/ubertooth-btle -n -q - > le.pcap 2> le.err
        ./ubertooth-tools/src/ubertooth-btle -n -c - > ppi.pcap 2> ppi.err
        ./ubertooth-tools/src/ubertooth-btle -r - > ng.out 2> ng.err
        set -e
        python3 - <<'PY'
        from pathlib import Path
        for name in ('le.pcap', 'ppi.pcap'):
            data = Path(name).read_bytes()
            assert len(data) == 24, (name, len(data))
            assert data[:4] == bytes.fromhex('4d3cb2a1'), (name, data[:4])
        assert Path('ng.out').read_bytes() == b''
        assert b'not supported' in Path('ng.err').read_bytes()
        PY

    - name: Python import check
      shell: bash
      # Confirm the Python packages at least import (not a functional test).
      run: |
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/specan_ui'); import specan"
        python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/host/python/ubtbr'); import ubtbr"

  firmware:
    strategy:
      fail-fast: false
      matrix:
        # Same tiers as the host job.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && '["ubuntu-22.04","ubuntu-24.04","macos-14","macos-15","macos-26","ubuntu-latest"]' || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    # The ARM toolchain is the big download in this workflow: 57 MB of
    # gcc-arm-none-eabi on Linux, a comparable cask on macOS. A mirror that
    # stops sending bytes part way through used to leave this step waiting
    # until the job timeout, so each step is bounded as in the host job.
    - name: Install dependencies (macOS)
      # Twelve minutes is well above what this step has ever legitimately
      # taken (four and a half on the oldest runner, where brew rebuilt a
      # dependency from source), and well below the job's fifteen, so a brew
      # that never finishes fails here by name.
      timeout-minutes: 12
      run: |
        # Refresh cask definitions first: the gcc-arm-embedded cask pins a
        # SHA-256 that breaks whenever Arm bumps a point release before the
        # runner image's Homebrew catches up (checksum mismatch on download).
        brew update
        brew install --cask gcc-arm-embedded
        brew install dfu-util
        pip install PyYAML
      if: runner.os == 'macOS'

    - name: Install dependencies (Ubuntu)
      # One bounded download of 120 seconds an attempt: at most 6 minutes 45
      # seconds, which this is above.
      timeout-minutes: 8
      run: |
        # gcc-arm-none-eabi recommends a large C++ runtime that none of the
        # firmware built here uses (only firmware/bootloader, which CI does not
        # build, links libstdc++); skip recommends and install newlib explicitly.
        packages="dfu-util gcc-arm-none-eabi libnewlib-arm-none-eabi"
        sudo tools/retry.sh 120 apt-get install -y --no-install-recommends -d $packages
        sudo apt-get install -y --no-install-recommends $packages
      if: runner.os == 'Linux'

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Pure-C firmware logic compiled and run with the host compiler -- no ARM
      # toolchain or hardware needed. Fails the job on any assertion failure.
      run: make test

    - name: Build
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      # Build the compile/link targets (elf/bin/sym) per subdirectory. We skip
      # the default target's final `dfu` step because it shells out to the
      # `ubertooth-dfu` host tool and is only needed to package firmware for
      # flashing, not to verify that the firmware compiles and links.
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.os }}
        path: |
          ${{github.workspace}}/firmware/*/*.bin
          ${{github.workspace}}/firmware/*/*.elf
        if-no-files-found: error

  # Issue and pull request numbers must not appear in source, tests or build
  # files (.kiro/steering/branch-and-review.md). A reviewer who happens to know
  # the rule is the only thing that caught the last ones, and only after they
  # had merged. Runs on both tiers: it takes seconds and needs nothing built.
  issue-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Check for issue numbers in source, tests and build files
      run: tools/check-issue-references.sh

    - name: Check that the check still catches one
      # So the step above cannot pass because the scan stopped reaching the
      # files. One plant per kind of file the rule names: a source file, a
      # CMake build file and a Makefile, since the per-directory build files
      # are reached by a different pathspec from the sources and were missed
      # once already. The plants are thrown away with the runner.
      #
      # The number is held in a variable because this workflow is itself a
      # build file the scan reads, and a literal would be a reference of
      # exactly the kind it refuses.
      run: |
        planted=4242
        for file in host/libubertooth/src/ubertooth.c \
                    host/CMakeLists.txt \
                    firmware/bluetooth_rxtx/Makefile; do
          printf '# see #%s\n' "$planted" >> "$file"
          if tools/check-issue-references.sh > planted.out 2>&1; then
            echo "the check passed with a reference planted in $file" >&2
            exit 1
          fi
          grep -q "$file:.*#$planted" planted.out || {
            echo "the check failed, but not on the line planted in $file:" >&2
            cat planted.out >&2
            exit 1
          }
          git checkout -- "$file"
          echo "caught in $file"
        done
        rm -f planted.out
        echo "The check catches a planted reference in source and build files."

  # Ubuntu 20.04 is the oldest supported Linux. GitHub retired the hosted
  # ubuntu-20.04 runner, so run it in a container on a current runner. The
  # container is root (no sudo) and starts bare, so install git/toolchain.
  host-ubuntu-20_04:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Install build prerequisites
      run: |
        apt-get update
        apt-get install -y git cmake build-essential pkg-config \
                           libfftw3-dev libusb-1.0-0-dev libbluetooth-dev python3

    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h

  firmware-ubuntu-20_04:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    # Installed in two steps so the toolchain download gets the same
    # stalled-mirror guard as the hosted firmware job: tools/retry.sh comes
    # from the checkout, and the checkout needs git first. Both steps skip
    # recommends as the firmware job does; ca-certificates is then needed
    # explicitly for the HTTPS checkout of the submodules.
    - name: Install checkout prerequisites
      # Two bounded commands of 100 seconds, so under 4 minutes at worst.
      # With the 8 of the toolchain step that leaves 3 of the job's 15 for the
      # checkout and the firmware build, which take well under one.
      timeout-minutes: 4
      # tools/retry.sh really is unavailable here, but timeout is not, so the
      # two downloads are bounded and say what happened, without being retried.
      run: |
        timeout 100 apt-get update ||
          { echo "error: apt-get update never finished; the mirror has stalled" >&2; exit 1; }
        timeout 100 apt-get install -y --no-install-recommends -d ca-certificates git ||
          { echo "error: downloading git never finished; the mirror has stalled" >&2; exit 1; }
        apt-get install -y --no-install-recommends ca-certificates git

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install the ARM toolchain
      timeout-minutes: 8
      run: |
        packages="make dfu-util gcc-arm-none-eabi libnewlib-arm-none-eabi"
        tools/retry.sh 120 apt-get install -y --no-install-recommends -d $packages
        apt-get install -y --no-install-recommends $packages

    - name: Build firmware
      working-directory: ${{github.workspace}}/firmware
      shell: bash
      run: |
        set -e
        for d in blinky bluetooth_rxtx cc2400_test clock_test usb_test assembly_test btbr; do
          echo "::group::firmware: $d"
          make -C "$d" bin sym
          echo "::endgroup::"
        done

  # Fedora as an early-warning canary: it ships newer CMake/Python/GCC sooner
  # than Ubuntu, so breakage shows here first. Hard-fails on the weekly
  # schedule (drift email), soft-fails on release and manual runs. Run in a
  # container (no hosted Fedora).
  host-fedora:
    # Full tier only.
    if: (github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
    - name: Install build prerequisites
      run: |
        dnf -y install git cmake gcc gcc-c++ make pkgconf-pkg-config \
                       fftw-devel libusb1-devel bluez-libs-devel python3

    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ env.LIBBTBB_REPO }}
        ref: ${{ env.LIBBTBB_REF }}
        path: 'libbtbb'

    - name: (libbtbb) Build and install
      shell: bash
      run: |
        cmake -E make_directory libbtbb/build
        cd libbtbb/build
        cmake "$GITHUB_WORKSPACE/libbtbb/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYTHON=OFF
        cmake --build . --config $BUILD_TYPE
        cmake --install . --config $BUILD_TYPE
        ldconfig || true

    - name: Build host
      shell: bash
      run: |
        cmake -E make_directory host/build
        cd host/build
        cmake "$GITHUB_WORKSPACE/host/" -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build . --config $BUILD_TYPE

    - name: Unit tests (host)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ctest --output-on-failure

    - name: Smoke test (binaries run)
      working-directory: ${{github.workspace}}/host/build
      shell: bash
      run: ./ubertooth-tools/src/ubertooth-util -h
