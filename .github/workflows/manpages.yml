name: Man pages

# The roff pages in host/doc/man are generated from host/doc/*.md and
# committed, because they are what `make install` installs. Nothing in a build
# regenerates them, so a .md edit that lands without a refresh ships a page
# that no longer matches its source. This job runs the refresh and fails if it
# changes anything.
#
# Pull requests run it only when the documentation, this workflow, or the
# build workflow it reads the libbtbb pin from changes, to keep them fast;
# every push to main runs it, so a refresh missed on a branch is caught on the
# merge. A manual run is for checking a ronn upgrade.
on:
  push:
    branches: [main]
    paths:
      - 'host/doc/**'
      - '.github/workflows/manpages.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'host/doc/**'
      - '.github/workflows/manpages.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Same cancellation rule as build.yml: only an older run of the same PR is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # Above the two bounded install steps below plus the libbtbb build and
    # the render.
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    # The libbtbb this fork builds against is pinned in build.yml's env, and
    # the host tree refuses a library that is missing what it calls. One
    # workflow cannot read another's env, so the pin is read out of the file
    # where it is decided, as the libbtbb-pin workflow does: a copy written
    # here would be one more thing to keep in step, and this job fetching a
    # different libbtbb than every other job is exactly the drift that broke
    # it.
    - name: Read the pinned libbtbb
      id: pin
      run: |
        build=.github/workflows/build.yml
        repo=$(sed -n 's/^  LIBBTBB_REPO: *//p' "$build")
        ref=$(sed -n 's/^  LIBBTBB_REF: *//p' "$build")
        : "${repo:?is not set in $build}"
        : "${ref:?is not set in $build}"
        echo "pinned in $build: $repo at $ref"
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4
      name: Fetch libbtbb
      with:
        repository: ${{ steps.pin.outputs.repo }}
        ref: ${{ steps.pin.outputs.ref }}
        path: 'libbtbb'

    - name: Install dependencies
      # Configuring the host tree needs its required dependencies even though
      # only the documentation subproject is built here.
      #
      # Bounded and retried as build.yml's installs are, because this job
      # gates every change under host/doc and a package source that stops
      # sending bytes used to stall it until the job timeout cancelled it,
      # with nothing in the log to say why. One package, so 120 seconds an
      # attempt is plenty: 4 minutes 30 at worst, and then the install, which
      # is not bounded because a command killed while unpacking leaves dpkg
      # half-done.
      timeout-minutes: 6
      run: |
        apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
        # sudo is outside the helper so the limit lands on apt itself:
        # killing sudo would leave apt holding the dpkg lock.
        sudo tools/retry.sh 120 sh -c \
          "apt-get $apt_opts update && apt-get $apt_opts install -y -d libusb-1.0-0-dev"
        sudo apt-get install -y libusb-1.0-0-dev

    - name: Install the pinned generator
      # RONN_VERSION in the CMake file is the one place the version is
      # decided, so it is read from there rather than repeated here: a bump
      # cannot leave this job behind.
      #
      # kramdown does the Markdown parse and ronn-ng accepts any 2.x of it, so
      # pinning ronn alone would leave the rendering free to change under a
      # kramdown release and turn this check red on a page nobody touched.
      # Both are installed first, and --conservative keeps them when ronn's
      # own dependency resolution runs. The versions are printed so a run's
      # log records what rendered the pages.
      #
      # rubygems.org is bounded and retried like the package installs, for
      # the same reason: it is a network fetch that can slow to a crawl, and
      # this job gates every change under host/doc. The three gems are one
      # unit, because an attempt that skipped the first two would leave
      # ronn's own dependency resolution to choose a kramdown. --conservative
      # on all three is what makes retrying cheap: a gem already at the
      # pinned version is left alone. 180 seconds an attempt is 6 minutes 30
      # at worst, well above the few seconds these take.
      timeout-minutes: 8
      run: |
        version=$(sed -n 's/^set(RONN_VERSION "\(.*\)")$/\1/p' \
          host/doc/man/CMakeLists.txt)
        test -n "$version" || { echo "no RONN_VERSION in host/doc/man/CMakeLists.txt" >&2; exit 1; }
        sudo tools/retry.sh 180 sh -c '
          gem install --no-document --conservative kramdown -v 2.5.2 &&
          gem install --no-document --conservative kramdown-parser-gfm -v 1.1.0 &&
          gem install --no-document --conservative ronn-ng -v "$1"' \
          install-gems "$version"
        ronn --version
        gem list kramdown nokogiri mustache ronn-ng

    - name: Build and install libbtbb
      # Same steps as build.yml: libbtbb is a required dependency of the host
      # tree, and upstream declares a cmake_minimum_required that CMake 4.x
      # rejects, so the policy minimum is forced. Its Python bindings are not
      # needed and fail on modern setuptools.
      run: |
        cmake -S libbtbb -B libbtbb/build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_PYTHON=OFF
        cmake --build libbtbb/build
        sudo cmake --install libbtbb/build
        sudo ldconfig

    - name: Configure
      run: cmake -S host -B build

    - name: Refresh the man pages
      # Without a usable ronn this target fails rather than rendering nothing,
      # so the check below cannot pass vacuously on a runner where the install
      # above went wrong.
      run: cmake --build build --target refresh-manpages

    - name: Check the committed pages match their Markdown
      # git diff covers tracked pages; git status also catches a page that was
      # rendered but never added.
      run: |
        untracked=$(git status --porcelain host/doc/man)
        if git diff --exit-code host/doc/man && [ -z "$untracked" ]; then
          echo "The committed man pages match host/doc/*.md."
          exit 0
        fi
        [ -n "$untracked" ] && printf 'not committed:\n%s\n' "$untracked"
        cat >&2 <<'EOF'

        The committed man pages in host/doc/man no longer match host/doc/*.md
        (the diff above is what a refresh writes). To fix it, run:

            cmake -S host -B build
            cmake --build build --target refresh-manpages

        then commit the regenerated .1 files together with the .md you edited.
        Install the pinned generator first if you do not have it; the version
        is RONN_VERSION in host/doc/man/CMakeLists.txt:

            gem install ronn-ng -v <that version>

        EOF
        exit 1
