name: libbtbb pin

# The pinned libbtbb commit is checked on its own, not as part of a build: it
# needs nothing compiled, and as a step of the host job it ran once per matrix
# entry, cloning libbtbb six times in a full-tier run for one answer. A bad
# pin now reports itself as a red check of its own rather than as a host build
# failure.
#
# The job also refuses a workflow file that names a libbtbb repository of its
# own rather than reading the pin, which is the other half of keeping one
# libbtbb in the tree: see the first step below.
#
# Its own workflow, rather than a job in build.yml, because of what it reads.
# Two of the files that have to agree on the pin are COMPATIBILITY.md and the
# build guides under docs/, and build.yml skips documentation changes so that
# a docs-only pull request does not run the whole matrix. A pin check that
# skipped them too would miss exactly the change most likely to break it. This
# has no path filter at all: it takes about five seconds.
#
# The job name below is in the gating set in
# .kiro/steering/branch-and-review.md; keep the two the same.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same cancellation rule as build.yml: only an older run of the same pull
# request is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  libbtbb-pin:
    runs-on: ubuntu-24.04
    # The clone is bounded to 60 seconds an attempt by tools/retry.sh below,
    # so 2 minutes 30 at worst, and the rest is a few greps.
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@v4

    - name: Check that no workflow names its own libbtbb
      # The step below requires every file that writes the pin out to name the
      # pinned repository. It says nothing about a file naming a different
      # libbtbb, because such a file is not claiming to use the pin -- which is
      # how the Man pages job came to fetch upstream and block every
      # documentation change. This closes that: no workflow but the two with a
      # reason may name a libbtbb repository literally.
      #
      # Reads files and nothing else, so it goes first and costs nothing.
      # tools/check-workflow-libbtbb-selftest.sh, run by build.yml's scripts
      # job, is what shows it still refuses a workflow that writes its own.
      timeout-minutes: 2
      run: tools/check-workflow-libbtbb.sh

    - name: Check the libbtbb pin
      # Its own limit, above the clone's worst case of 2 minutes 30, so the
      # step that stalled is the one that fails rather than the whole job
      # being cancelled without saying what it was waiting for.
      timeout-minutes: 4
      shell: bash
      # Two things have to hold for the pin: every file that writes it out
      # agrees, and the commit is one a user can actually get.
      run: |
        status=0

        # build.yml's env is where the pin is decided and where every build
        # fetches it from, so it is read out of that file rather than
        # repeated here. Repeating it would give this check its own copy to
        # agree with, which is the drift it exists to catch.
        build=.github/workflows/build.yml
        LIBBTBB_REPO=$(sed -n 's/^  LIBBTBB_REPO: *//p' "$build")
        LIBBTBB_REF=$(sed -n 's/^  LIBBTBB_REF: *//p' "$build")
        : "${LIBBTBB_REPO:?is not set in $build}"
        : "${LIBBTBB_REF:?is not set in $build}"
        echo "pinned in $build: $LIBBTBB_REPO at $LIBBTBB_REF"

        # The pin is a commit while libbtbb fixes are landing, and the
        # release plan points it at a matching tag of the libbtbb fork
        # instead. Only a commit can be compared with the commits these files
        # write out, so the two rules further down are for a commit pin; a tag
        # is required to be in each file and nothing more, as everything was
        # before those rules.
        #
        # Case is folded away here and in every comparison below, because a
        # commit means the same commit whatever case it is written in. The one
        # the files carry is lower case, and a pin written in capitals should
        # be read as the commit it is rather than taken for a tag.
        pin_lower=$(printf '%s' "$LIBBTBB_REF" | tr 'A-F' 'a-f')
        if printf '%s' "$pin_lower" | grep -qE '^[0-9a-f]{40}$'; then
          pin_is_commit=yes
        else
          pin_is_commit=no
          echo "note: the pin is not a commit, so each file is required to"
          echo "      name it and the commits in it are left alone"
        fi

        # The repository name as a pattern, with anything a regular
        # expression would read taken literally. An owner or a repository may
        # carry a dot, which would otherwise match any character.
        repo_pattern=$(printf '%s' "$LIBBTBB_REPO" | sed 's|[^A-Za-z0-9_/-]|\\&|g')

        # The pin is written out again in every file that builds libbtbb,
        # states which one this fork uses, or tells a user which one to go and
        # get. Fail here, naming the file, rather than let one of them drift to
        # another libbtbb. Two are worth knowing: FindBTBB.cmake, because when
        # the host configure step refuses a libbtbb that is too old for the
        # tree, the commit it tells the reader to rebuild at comes from there;
        # and the Man pages workflow, which cannot read build.yml's env and so
        # keeps its own copy of the pin. build.yml itself is in the list for
        # the commit rules below: the pin is read out of it, so a superseded
        # commit left behind there is the most misleading place of all. Its
        # first two checks are true of it by construction.
        for f in install.sh COMPATIBILITY.md \
                 docs/source/build_guide.rst docs/source/building_from_git.rst \
                 host/cmake/modules/FindBTBB.cmake \
                 .github/workflows/manpages.yml "$build"; do
          grep -q "$LIBBTBB_REF" "$f" || {
            echo "error: $f does not name the pinned libbtbb commit $LIBBTBB_REF" >&2
            status=1
          }
          grep -q "$LIBBTBB_REPO" "$f" || {
            echo "error: $f does not name the pinned libbtbb repository $LIBBTBB_REPO" >&2
            status=1
          }

          [ "$pin_is_commit" = yes ] || continue

          # Naming the pin is not enough on its own: a file can name it in
          # one place and a superseded commit in another, which is how
          # COMPATIBILITY.md came to pass with two commits in its libbtbb row,
          # the new one in the link URL and the old one as the link text. So
          # every commit written out in full, anywhere in the file, has to be
          # the pin.
          #
          # Anywhere, rather than on whichever line looks like the one that
          # pins, because the forms that pin differ: a "ref:" handed to
          # actions/checkout, a variable set, a git checkout a reader types, a
          # link. Forty hex digits needs no such guess. Nothing else in these
          # files is written that way, and each holds exactly one such run
          # today, so a second is a commit left behind -- in a comment or in
          # prose as much as on a line that builds.
          #
          # Forty, and not a digit more or less: each unbroken run of hex
          # digits is taken out whole and then kept only if it is exactly
          # forty long. Asking grep for forty digits instead would match the
          # first forty of a longer run, so a sha256 of a release tarball --
          # sixty-four digits -- would be read as a commit that is not the
          # pin, and the check would go red over a file that is right.
          while IFS=: read -r line commit; do
            [ -n "$commit" ] || continue
            lower=$(printf '%s' "$commit" | tr 'A-F' 'a-f')
            if [ "$lower" != "$pin_lower" ]; then
              echo "error: $f:$line names libbtbb commit $commit, and the pin is" >&2
              echo "       $LIBBTBB_REF" >&2
              status=1
            fi
          done <<< "$(grep -noiE '[0-9a-f]+' "$f" | grep -iE ':[0-9a-f]{40}$')"

          # And an abbreviated commit beside a link to the pin has to
          # abbreviate the pin. That is the one short form these files use,
          # and the one that drifted: the COMPATIBILITY.md row names the
          # commit in backticks as the text of the link to it.
          #
          # Only lines linking a commit of the pinned repository are read for
          # these, because seven hex digits on their own are not much to go
          # on: the build guide links a comment on a libbtbb issue whose
          # anchor ends in nine digits, and a word of hex letters would read
          # as a commit too. One of the digits has to be a numeral for the
          # same reason, which leaves an abbreviation of all letters, about
          # one in a thousand, unchecked.
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            line=${hit%%:*}
            text=${hit#*:}
            # The full-length runs are the rule above's; blanked out so that
            # what is read here is the short forms only. Forty digits or
            # more, and the whole run, so that the tail of a longer one is
            # not left behind to be read as an abbreviation: blanking only
            # the first forty digits of a sha256 would leave twenty-four and
            # turn a file that is right red.
            for commit in $(printf '%s\n' "$text" |
                            sed 's/[0-9a-fA-F]\{40,\}/ /g' |
                            grep -oiE '[0-9a-f]{7,39}' | grep -E '[0-9]'); do
              lower=$(printf '%s' "$commit" | tr 'A-F' 'a-f')
              case $pin_lower in
              "$lower"*) ;;
              *)
                echo "error: $f:$line abbreviates libbtbb commit $commit beside a link" >&2
                echo "       to the pinned $LIBBTBB_REF" >&2
                status=1
                ;;
              esac
            done
          done <<< "$(grep -niE "github\.com/$repo_pattern/commit/" "$f")"
        done

        # Agreeing on a commit is not enough: it has to be a commit a clone
        # can reach. GitHub keeps serving a pull request's head commit by its
        # hash even after that branch is deleted, so the checkouts below would
        # fetch it happily while every user following install.sh or a build
        # guide -- git clone, then git checkout <commit> -- gets "unable to
        # read tree". Clone the way they do and require the pin to be an
        # ancestor of the default branch.
        #
        # The clone is removed inside the retried command, because an attempt
        # that had to be killed leaves the directory behind and git refuses to
        # clone into one that is not empty.
        : "${RUNNER_TEMP:?}"
        clone="$RUNNER_TEMP/libbtbb-pin.git"
        # http.lowSpeedLimit makes git itself abandon a transfer that has
        # slowed to a trickle for 30 seconds, so a stalled clone is git's own
        # error well before the retry limit is near.
        tools/retry.sh 60 sh -c 'rm -rf "$1" && git -c http.lowSpeedLimit=1000 \
          -c http.lowSpeedTime=30 clone --quiet --bare "$2" "$1"' \
          clone-libbtbb "$clone" "https://github.com/$LIBBTBB_REPO"
        branch=$(git -C "$clone" symbolic-ref --short HEAD)

        # Requiring the default branch is stricter than a user needs, since a
        # full clone brings down the other branches too. That is deliberate:
        # install.sh and the guides promise a commit of the released library,
        # not whatever a side branch holds today.
        if ! git -C "$clone" merge-base --is-ancestor "$LIBBTBB_REF" "$branch" 2> /dev/null; then
          echo "error: libbtbb commit $LIBBTBB_REF is not on $LIBBTBB_REPO's" >&2
          echo "       $branch branch, so it is not a released commit. A" >&2
          echo "       squash-merged pull request head whose branch is gone is" >&2
          echo "       served to CI by its hash but is in nobody's clone, and a" >&2
          echo "       side branch moves under users' feet." >&2
          echo "       Pin a commit merged to $branch." >&2
          status=1
        fi

        # So the assert above cannot pass by having stopped comparing, which
        # is how the gap it closes went unnoticed in the first place. The
        # control is a commit written here, which the clone therefore has while
        # $branch does not contain it: refusing it needs a real ancestry
        # comparison, where a commit hard-coded in a workflow would have been
        # refused merely for being absent from a bare clone. Writing it rather
        # than picking a side branch keeps the check from depending on what
        # branches the libbtbb fork happens to carry.
        control=$(GIT_AUTHOR_NAME=pin GIT_AUTHOR_EMAIL=pin@invalid \
                  GIT_COMMITTER_NAME=pin GIT_COMMITTER_EMAIL=pin@invalid \
                  git -C "$clone" commit-tree "$branch^{tree}" \
                    -p "$branch" -m control < /dev/null)
        if git -C "$clone" merge-base --is-ancestor "$control" "$branch" 2> /dev/null; then
          echo "error: the check above accepted $control, which is not on" >&2
          echo "       $branch, so it is no longer checking anything" >&2
          status=1
        fi
        rm -rf "$clone"

        exit $status
